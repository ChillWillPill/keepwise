# KeepWise API: a small pass-through for KeepWise Plus live sales.
# It stores nothing and logs nothing; each request is forwarded and the answer handed straight back.
name = "keepwise-api"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[observability]
enabled = false

[vars]
# Switch to "production" only after Plaid approves production access and Plus checks who has paid.
PLAID_ENV = "sandbox"
# Paddle for Plus: "sandbox" while testing, "production" when you go live (must match PADDLE_CONFIG.env in src/app.html).
PADDLE_ENV = "production"
# Plus Ultra price ids from Paddle, monthly then yearly (not secret): "pri_xxx_monthly,pri_xxx_yearly"
ULTRA_PRICE_IDS = "pri_01m6cf50e7a1vcvdtfvb6cmpza,pri_01m6cf5t9t0b05zcnd7zdazz2d"

# Secrets: never put these in this file or in chat. Add each in Cloudflare → Workers → keepwise-api → Settings →
# Variables and Secrets → Add → Type: Secret. Example shapes only:
#   PADDLE_API_KEY  = pdl_sdbx_apikey_xxxxxxxxxxxxxxxx   (Paddle → Developer tools → Authentication → API keys)
#   RESEND_API_KEY  = re_xxxxxxxxxxxxxxxx                (already used for split and invoice emails)
#   PLAID_CLIENT_ID / PLAID_SECRET                        (already used for bank connections)

# Once a day, close bank links for anyone whose Plus has ended (backup for the Paddle webhook).
[triggers]
crons = ["23 7 * * *"]

# Bank links to close when Plus ends: the KV namespace keepwise-plaid (sealed Plaid keys per account email, nothing else).
[[kv_namespaces]]
binding = "PLAID_ITEMS"
id = "d984d96c8e634877bd2ecd3f81874fa9"
#
# Also add the secret PADDLE_WEBHOOK_SECRET (Paddle → Developer tools → Notifications → your destination's secret key),
# with the destination URL https://keepwise-api.keepwise.workers.dev/paddle/webhook and the subscription.* events.
