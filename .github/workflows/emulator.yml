name: Emulator check (real Android app, several screen sizes)

on:
  push:
    branches: [emulator-check]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: python3 scripts/build.py && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  phones:
    needs: apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: small-320dp, profile: "Nexus One", scale: "1.0", night: "no"}
          - {name: phone-360dp-bigtext, profile: "Nexus 5", scale: "1.3", night: "no"}
          - {name: phone-412dp-dark, profile: "pixel_6", scale: "1.0", night: "yes"}
          - {name: big-phone-bigtext, profile: "pixel_7_pro", scale: "1.15", night: "no"}
          - {name: tablet, profile: "Nexus 9", scale: "1.0", night: "no"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
      - run: pip install websocket-client
      - name: Let the emulator use hardware speed
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app-debug.apk
            adb shell settings put system font_scale ${{ matrix.scale }}
            adb shell cmd uimode night ${{ matrix.night }}
            python3 scripts/emulator_shots.py shots ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.name }}
          path: shots
