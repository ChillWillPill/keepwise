name: Send KeepWise push notifications

on:
  schedule:
    - cron: "*/10 * * * *"   # friends' splits, every 10 minutes
    - cron: "7 13 * * *"     # the payday nudge, once a day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: Friends' splits
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python scripts/send_split_push.py
      - name: Payday nudge
        if: github.event.schedule == '7 13 * * *'
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python scripts/send_push.py
