details.card:not([open]){gap:0}
.btn.small.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line));background:var(--green-soft);opacity:1;cursor:default;display:inline-flex;align-items:center;gap:4px}
.btn.small.done svg{width:14px;height:14px}
@keyframes kw-flash{from{background:var(--green-soft)}to{background:transparent}}
.flash{animation:kw-flash 1.4s ease-out}
.ask-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:2px 4px}.ask-chips::-webkit-scrollbar{display:none}.ask-chips .chip{flex:none;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.flash{animation:none}}
details summary{cursor:pointer;font-weight:600;color:var(--green);list-style:none}
details summary::-webkit-details-marker{display:none}
.cmp-wrap{display:flex;flex-direction:column;gap:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:104px;border-bottom:1px solid var(--line)}
.cmp-col{appearance:none;border:0;background:transparent;border-radius:14px 14px 0 0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding:0;cursor:pointer;position:relative;font:inherit;color:var(--ink)}
.cmp-col:hover,.cmp-col.on,.cmp-col:focus-visible{background:var(--chip);outline:none}
.cmp-val{font-weight:600;font-size:.95rem;color:var(--muted)}
.cmp-bar{display:block;width:44%;max-width:72px;border-radius:4px 4px 0 0;background:var(--green)}
.cmp-bar.now{background:color-mix(in srgb,var(--green) 55%,var(--card))}
.cmp-tip{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:none;flex-direction:column;align-items:flex-start;gap:2px;white-space:nowrap;z-index:2;text-align:left;font-size:.95rem;pointer-events:none}
.cmp-tip small{opacity:.8}
.cmp-col:hover .cmp-tip,.cmp-col.on .cmp-tip,.cmp-col:focus-visible .cmp-tip{display:flex}
.cmp-labels{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.cmp-bar{animation:grow .4s ease-out both;transform-origin:bottom}@keyframes grow{from{transform:scaleY(.2)}to{transform:scaleY(1)}}}
.env-row{padding:0}
.env-head{appearance:none;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit;padding:14px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.env-head>.row-top,.env-head>.meter{width:100%;box-sizing:border-box;flex:none}  /* Safari does not stretch the children of a button, so the bar had no width */
.env-head:focus-visible{outline:2px solid var(--green);outline-offset:-3px;border-radius:14px}
.env-hint{display:inline-flex;align-items:center;gap:4px;align-self:flex-end}
.env-row.open .env-hint svg{transform:rotate(180deg)}
.env-body{padding:0 18px 16px;display:flex;flex-direction:column;gap:0}
.env-body > .btn.primary{margin-bottom:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.line .inline{flex-wrap:nowrap}
.danger-link{color:var(--rust)}
.add-line{margin-top:12px;flex-wrap:nowrap}
.review{border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.review-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.review-btns .btn{padding:10px 6px;white-space:nowrap;font-size:.92rem}
.import-card h3{font-size:1.05rem}
.people .person,.people .person-wrap{border-bottom:1px solid var(--line)}
.people > :last-child,.people .person-wrap .person{border-bottom:0}
.person{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;background:none;border:0;font:inherit;color:inherit;text-align:left;-webkit-tap-highlight-color:transparent}
button.person{cursor:pointer}
button.person:hover{background:color-mix(in srgb,var(--chip) 45%,transparent)}
button.person:focus-visible{outline:2px solid var(--green);outline-offset:-3px}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.95rem;letter-spacing:.02em;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 45% var(--av-fg))}
.pname{display:flex;flex-direction:column;min-width:0;flex:1}

.person-edit{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.acct-btn{overflow:hidden;padding:0}

.acc-photo-btns{justify-content:center}
.acc-form{display:flex;flex-direction:column;gap:14px}

.g-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:13px 14px;font-size:1rem;border-radius:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.93rem;line-height:1.45;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--green)}
.acc-legal{text-align:center}
.icon-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon-pick{display:grid;grid-template-columns:repeat(6,minmax(0,48px));gap:8px;margin-top:6px}
.icon-opt{appearance:none;width:100%;aspect-ratio:1;min-height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}

.icon-opt.icon-auto{width:auto;aspect-ratio:auto;min-height:34px;padding:0 12px;border-style:dashed;font:600 .8125rem/1 var(--body);display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.icon-opt.icon-auto svg{width:16px;height:16px}
.icon-opt.icon-auto[aria-pressed="true"]{border-style:solid;color:var(--green)}
.part-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}

.part-row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-top:1px solid var(--line);min-height:52px}

.part-row input{width:96px;flex:none;padding:8px 10px}
.part-av{width:32px;height:32px;font-size:.78rem}
.part-x{appearance:none;border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.part-x:hover{background:var(--chip);color:var(--rust)}
.part-search{position:relative;margin-top:8px}
.part-results{margin-top:6px;border:1px solid var(--line);border-radius:14px;background:var(--card);max-height:260px;overflow:auto;box-shadow:var(--lift)}
.part-opt{appearance:none;display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:600 .95rem var(--body);padding:10px 12px;cursor:pointer;text-align:left}

.part-opt:hover,.part-opt:focus-visible{background:var(--chip)}
.part-new{color:var(--green)}
.moments-teaser{border-color:color-mix(in srgb,var(--gold) 35%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--gold-soft) 70%,var(--card)),var(--card) 60%)}
.moment-chips{display:flex;flex-wrap:wrap;gap:6px}
.moment-chips span{font-size:.78rem;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px}

.m-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.m-stats b{display:block;font:600 1.3rem/1.2 var(--display)}
.m-stats span{font-size:.8rem;color:var(--muted)}
.m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.m-tile{aspect-ratio:1;border-radius:10px}
.m-t1{background:linear-gradient(135deg,#f0b27a,#c0605a)} .m-t2{background:linear-gradient(135deg,#7fb8d6,#3d6f8f)} .m-t3{background:linear-gradient(135deg,#9ccf9a,#4d8b5f)}
.m-t4{background:linear-gradient(135deg,#e7c6e8,#8c6aa8)} .m-t5{background:linear-gradient(135deg,#f5dc8a,#c79a3a)} .m-t6{background:linear-gradient(135deg,#a6c9c0,#4e7f7a)}
.space-switch{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}

.biz-panel{grid-area:1/1;align-self:start;margin-top:40px;box-shadow:0 20px 50px -24px rgba(0,0,0,.45);border-color:color-mix(in srgb,var(--gold) 40%,var(--line));position:relative;z-index:1}

.gchip b{background:var(--chip);border-radius:99px;padding:1px 7px;font-size:.75rem}
.gchip svg{flex:none;width:16px;height:16px;color:var(--green)}
.gchip.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.group-save{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.group-save input{flex:1 1 180px}
.link.group-save-link{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600;margin-top:10px;align-self:flex-start}
.group-save-link svg{width:16px;height:16px}
.contacts-on{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--lift)}
.co-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.co-act{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.contacts-card{gap:10px}
/* ---- statements ---- */
.hist-bars{display:flex;align-items:flex-end;gap:8px;min-height:150px;padding-top:4px}
.hist-col{appearance:none;border:0;background:none;padding:0;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font:inherit}
.hist-v{font-size:.72rem;font-weight:600;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hist-bar{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:color-mix(in srgb,var(--green) 55%,var(--card))}
.hist-bar.now{background:var(--green)}
.hist-bar.neg{background:color-mix(in srgb,var(--rust) 60%,var(--card))}
.hist-m{font-size:.78rem;color:var(--muted);font-weight:600}
.hist-col:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:10px}
.stmt-row{appearance:none;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer}
.stmt-row:last-child{border-bottom:0}
.stmt-row:hover{background:color-mix(in srgb,var(--chip) 40%,transparent)}
.stmt{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--lift)}
.st-head{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.st-brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.st-brand b{font:600 1.15rem/1.1 var(--display);letter-spacing:-.025em}
.st-title{font:600 1.75rem/1.1 var(--display);letter-spacing:-.025em;margin-top:6px}
.st-status{color:var(--muted);font-weight:600}
.st-status.open{color:var(--green)}
.st-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st-sum>div{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.st-sum b{font:600 1.15rem/1.15 var(--display);white-space:nowrap}
@media (max-width:380px){.st-sum{grid-template-columns:1fr}.st-sum>div{flex-direction:row;justify-content:space-between;align-items:baseline}}
.stmt h3{font:600 .8rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.st-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}
.st-line span:first-child{min-width:0;overflow-wrap:anywhere}
.st-foot{padding-top:12px;border-top:1px solid var(--line)}
/* ---- coming up ---- */
.st-one{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--bg);border-radius:14px;padding:14px}
.st-one b{font:600 1.35rem var(--display)}
.up-list{display:flex;flex-direction:column}
.up-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.up-row:first-child{border-top:0;padding-top:2px}
.up-date{width:48px;flex:none;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:6px 0;line-height:1.05}
.up-date b{font:600 1.25rem var(--display)}
.up-date span{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.up-row.drop .up-date{background:var(--rust-soft);color:var(--rust)}
.up-main{flex:1;min-width:0}
.renew-set{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.renew-set select,.renew-set input{width:auto;flex:1 1 160px;min-height:38px;padding:6px 10px}
/* ---- cancel help ---- */
.drop-help{display:flex;flex-direction:column;gap:6px;background:var(--rust-soft);border-radius:12px;padding:10px 12px}
.link.renew-btn{color:var(--green);font-weight:600;font-size:.84rem}
.link.renew-btn.add{color:var(--muted);font-weight:500}
.renew-set{background:var(--bg);border-radius:12px;padding:8px 10px}
.cancel-link{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--green);text-decoration:none;font-size:.9rem}
.cancel-link:hover{text-decoration:underline}
.cancel-link svg{width:14px;height:14px}
/* ---- backup ---- */
.backup{display:flex;flex-direction:column;gap:12px}
.backup>div:first-child{display:flex;flex-direction:column;gap:2px}
.backup.due>div:first-child b{color:var(--rust)}
.btn svg{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.keep-safe{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.keep-safe p{margin-top:4px}
.keep-safe svg{width:16px;height:16px;vertical-align:-3px;margin:0 3px}
/* ---- share ---- */
.share-img{width:100%;max-width:440px;align-self:center;border-radius:22px;box-shadow:var(--lift);border:1px solid var(--line)}
.share-btn{align-self:flex-start}
/* ---- first-run setup ---- */
.app.welcoming .tabbar{display:none}
.welcome{max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:6px}
.w-logo{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line),var(--lift);align-self:center;margin-top:8px}
.w-title{font:600 clamp(1.9rem,8vw,2.4rem)/1.08 var(--display);letter-spacing:-.03em;text-align:center}
.w-sub{color:var(--muted);text-align:center;font-size:1.02rem;margin-top:-6px}
.w-points{list-style:none;display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--lift)}
.w-points li{display:flex;gap:14px;align-items:center}
.w-points svg{width:26px;height:26px;flex:none;color:var(--green)}
.w-safe{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:.9rem}
.w-safe svg{width:16px;height:16px}
.w-cta{padding:15px;font-size:1.02rem}
.w-alt{align-self:center;padding:10px 4px;margin:-4px 0}
.w-dots{display:flex;gap:6px;justify-content:center}
.w-dots i{width:26px;height:5px;border-radius:9px;background:var(--line)}
.w-dots i.on{background:var(--green)}
.w-big{min-height:60px}
.w-big input{font:600 1.5rem var(--display)}
.w-big em{font:600 1.3rem var(--display)}
.w-choice{appearance:none;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--lift)}
.w-choice>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:3px}
.w-choice:hover{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.w-ic{width:44px;height:44px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.w-ic svg{width:24px;height:24px}
.w-choice>svg{color:var(--muted);flex:none}
/* ---- print a statement ---- */
@media print{
  .app-header,.tabbar,.no-print,.toast{display:none!important}
  html,body{background:#fff!important}
  .app{position:static!important;height:auto!important}
  .app-main{overflow:visible!important}
  .view{padding:0!important;max-width:none}
  .stmt{box-shadow:none;border:0;padding:0}
  .st-sum>div{border:1px solid #ddd}
}

<script>
(() => {
"use strict";
/* ================= viewport: keep the shell pinned to what is actually visible ================= */
const appEl = document.getElementById("app"), vv = window.visualViewport, rootStyle = document.documentElement.style;
function fit(){
  rootStyle.setProperty("--vv-h", (vv ? vv.height : window.innerHeight) + "px");
  rootStyle.setProperty("--vv-top", (vv ? vv.offsetTop : 0) + "px");
}
// The field being typed in must stay above the keyboard: when the visible area shrinks (keyboard opens) or a field
// gets focus, bring it to the middle of what is left of the screen.
function showField(){
  const el = document.activeElement, m = document.getElementById("main");
  if (!m || !el || !el.matches || !el.matches("input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select") || !m.contains(el)) return;
  const r = el.getBoundingClientRect(), b = m.getBoundingClientRect();
  if (r.top < b.top + 12 || r.bottom > b.bottom - 12) m.scrollTop += (r.top + r.height / 2) - (b.top + b.height / 2);
}
let fitRaf; const refit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(() => { fit(); showField(); }); };
if (vv){ vv.addEventListener("resize", refit); vv.addEventListener("scroll", refit); }
["resize","orientationchange","pageshow","load"].forEach(e => window.addEventListener(e, refit));
const isField = el => !!(el && el.matches && el.matches("input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select"));
document.addEventListener("focusin", e => { if (isField(e.target) && e.target.tagName !== "SELECT") appEl.classList.add("typing");
  if (isField(e.target)) [120, 350, 650].forEach(ms => setTimeout(showField, ms)); });  // the keyboard slides in over about half a second

const ptrEnd = () => setTimeout(() => { ptrDown = false; if (blurPending) { blurPending = false; afterBlur(); } }, 0);
document.addEventListener("pointerup", ptrEnd, true);
document.addEventListener("pointercancel", ptrEnd, true);
document.addEventListener("focusout", () => setTimeout(() => { if (ptrDown) blurPending = true; else afterBlur(); }, 60));

window.scrollTo(0,0); fit(); [100,400,1000,2000].forEach(ms => setTimeout(fit, ms));

/* ================= money math ================= */
const subMonthly = s => s.cycle === "yr" ? s.price / 12 : s.price;
const isOurs = s => /keep\s*wise/i.test(s.name || "");  // never flag or question our own subscription
function subFlags(){
  const out = {};
  S.subs.forEach(s => {
    const reasons = [], d = s.last ? daysSince(s.last) : null;
    if (isOurs(s)){ out[s.id] = reasons; return; }
    if (s.low) reasons.push("You said you barely use it");
    if (d !== null && d > S.ruleDays) reasons.push(`Unused for ${d} days`);
    if (s.group && d !== null){
      const newer = S.subs.find(o => o !== s && !isOurs(o) && o.last && o.group && o.group.toLowerCase() === s.group.toLowerCase() && o.keep !== "drop" && daysSince(o.last) < d);
      if (newer) reasons.push(`Duplicate of ${newer.name}`);
    }
    out[s.id] = reasons;
  });
  return out;
}
const ownSwap = w => !w.idea && !/^w\d+$/.test(String(w.id));   // written by the person, not one of the built-in ideas or the example month
function swapFor(type, id){ return S.swaps.find(w => w.on && w.link === `${type}:${id}`); }
function compute(){
  const flags = subFlags();
  let needs = 0, misc = 0;
  S.expenses.forEach(e => { const w = swapFor("expense", e.id), a = w ? +w.altCost : +e.amount || 0; if (e.env === "needs") needs += a; else misc += a; });
  const liveSubs = S.subs.filter(s => s.keep !== "drop");
  liveSubs.forEach(s => { const w = swapFor("sub", s.id), a = w ? +w.altCost : subMonthly(s); if (s.env === "needs") needs += a; else misc += a; });
  const trips = tripsCounted(planPeriodNow().key), spends = spendsTotal(planPeriodNow().key); misc += trips + spends;  // a finished trip you chose to count is a one-off in that month
  const giving = givingMonthly(); misc += giving;  // what you give regularly counts under Miscellaneous
  const loans = loansMonthly(); needs += loans;  // debt payments are part of what must go out; Month shows them on their own row
  const bonus = payBonus(planPeriodNow());
  const income = (+S.income || 0) + extraExpected() + bonus.extra + insTotal(planPeriodNow().key);  // one-off money in counts in the month it arrived
  const savings = income - needs - misc;
  const flagged = liveSubs.filter(s => flags[s.id].length && s.keep !== "keep");
  const flaggedSave = flagged.reduce((a, s) => { const w = swapFor("sub", s.id); return a + (w ? +w.altCost : subMonthly(s)); }, 0);
  if (S.env.needs + S.env.misc + S.env.save !== 100) envFix();   // a plan restored from elsewhere is held to the same rule
  const envNeeds = income * S.env.needs / 100, envMisc = income * S.env.misc / 100, envSave = income * S.env.save / 100;
  const efTarget = S.efMonths * needs;
  const efGap = Math.max(0, efTarget - S.efSaved);
  let toEF = 0, toGoal = 0;
  const pos = Math.max(0, savings);
  if (S.priority === "ef"){ toEF = Math.min(pos, efGap); toGoal = pos - toEF; }
  else if (S.priority === "goal"){ toGoal = Math.min(pos, S.goalAmt || pos); toEF = pos - toGoal; }
  else { toEF = Math.min(pos / 2, efGap); toGoal = pos - toEF; }
  const efMonthsLeft = toEF > 0 ? Math.ceil(efGap / toEF) : null;
  const inactiveSwaps = S.swaps.map(w => ({w, save: swapSaving(w)})).filter(x => !x.w.on && x.save > 0).sort((a,b) => b.save - a.save);
  const now = new Date(), P0 = periodOf(now), left = Math.round((P0.end - todayMid()) / DAY);
  const nextMonth = left <= 2;
  const P = nextMonth ? periodOf(new Date(P0.end.getFullYear(), P0.end.getMonth(), P0.end.getDate() + 1)) : P0;
  // With a month that starts on payday, calendar names mislead ("September ends tomorrow" on 3 October), so dates are used.
  const own = monthStartDay() !== 1, endDay = dayMonth(P0.end);
  const planNote = own
    ? (nextMonth ? (left === 0 ? `Your month ends today, so this plan covers the next one: ${rangeText(P)}.` : left === 1 ? `Your month ends tomorrow, ${endDay}, so this plan covers the next one: ${rangeText(P)}.` : `${left} days left in your month, which ends ${endDay}. This plan covers the next one: ${rangeText(P)}.`) : `${left} days left in your month, ${rangeText(P0)}.`)
    : (nextMonth ? (left === 0 ? `Today is the last day of ${P0.name}, so this plan covers ${P.name}.` : left === 1 ? `${P0.name} ends tomorrow, so this plan covers ${P.name}.` : `${left} days left in ${P0.name}. This plan covers ${P.name}.`) : `${left} days left in ${P0.name}. This plan covers ${P0.name}.`);
  const planKey = P.key;
  const setAside = (S.deposits || []).filter(x => x.month === planKey).reduce((a,x) => a + x.amount, 0);
  const endSaved = S.efSaved + savings - setAside;
  const toSetAside = Math.max(0, r2(savings - setAside));
  return {flags, needs, loans, trips, spends, misc, income, savings, flagged, flaggedSave, envNeeds, envMisc, envSave, efTarget, efGap, toEF, toGoal, efMonthsLeft, inactiveSwaps, planMonth: P.name, planPeriod: P, payBonus: bonus, planNote, liveSubs, planKey, setAside, endSaved, toSetAside};
}
function linkedItem(w){
  const [type, id] = w.link.split(":");
  if (type === "expense"){ const e = S.expenses.find(x => x.id === id); return e ? {name:e.name, cost:+e.amount} : null; }
  const s = S.subs.find(x => x.id === id); return s && s.keep !== "drop" ? {name:s.name, cost:subMonthly(s)} : null;
}
function swapSaving(w){ const it = linkedItem(w); return it ? Math.max(0, it.cost - (+w.altCost || 0)) : 0; }

/* ================= split math (works on this phone's list or the shared circle) ================= */
const SH = {state:"loading", db:null, user:null, me:null, splits:[], pays:[], members:[], names:{}, lastSeen:0, loaded:{splits:false, pays:false, members:false}, known:null, joinTried:false};
const shared = () => !!window.claude && S.splitMode === "shared" && SH.state === "ready";
function CTX(){
  if (shared()){
    const ids = [SH.me, ...SH.members.filter(m => m !== SH.me)];
    return {kind:"shared", me:SH.me, splits:SH.splits.filter(x => !x.deleted), pays:SH.pays.filter(x => !x.deleted), people: ids.map(id => ({id, name: id === SH.me ? "You" : (SH.names[id] || "Someone")}))};
  }
  return {kind:"local", me:"me", splits:S.splits, pays:S.settlements, people:S.people};
}
const person = (id, c) => (c || CTX()).people.find(p => p.id === id) || {id, name: SH.names[id] || "Someone"};
function shares(x){
  const out = {}, ids = Object.keys(x.parts || {});
  if (x.method === "equal"){ ids.forEach(id => out[id] = x.amount / ids.length); }
  else if (x.method === "percent"){ ids.forEach(id => out[id] = x.amount * (+x.parts[id] || 0) / 100); }
  else if (x.method === "exact"){ ids.forEach(id => out[id] = +x.parts[id] || 0); }
  else if (x.method === "borrow"){ ids.forEach(id => out[id] = x.amount); }
  return out;
}
function debts(c){ // pairwise: debt[a][b] = what a owes b
  c = c || CTX(); const d = {};
  const add = (a, b, v) => { if (a === b || !v) return; (d[a] = d[a] || {}); d[a][b] = (d[a][b] || 0) + v; };
  c.splits.forEach(x => { const sh = shares(x); for (const id in sh) add(id, x.paidBy, sh[id]); });
  c.pays.forEach(s => add(s.to, s.from, s.amount)); // a payment from A to B cancels A's debt to B
  return d;
}
function myBalances(c){
  c = c || CTX(); const d = debts(c), me = c.me, out = [];
  c.people.filter(p => p.id !== me).forEach(p => {
    const net = r2(((d[p.id] || {})[me] || 0) - ((d[me] || {})[p.id] || 0)); // + they owe me
    if (Math.abs(net) >= 0.01) out.push({p, net});
  });
  out.sort((a,b) => a.net - b.net);
  return out;
}
function splitLine(x, c){
  c = c || CTX(); const sh = shares(x), me = c.me, bits = [];
  for (const id in sh){
    if (id === x.paidBy || !sh[id]) continue;
    if (x.paidBy === me) bits.push({t:`${person(id, c).name} owes you ${fmt(sh[id])}`, good:true});
    else if (id === me) bits.push({t:`You owe ${person(x.paidBy, c).name} ${fmt(sh[id])}`, good:false});
  }

const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

// ---- CSV ----
function csvRows(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === ";" && !text.slice(0, 200).includes(",")) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); if (row.some(x => x.trim())) rows.push(row); row = []; f = ""; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
function txFromCSV(text){
  const rows = csvRows(text.replace(/^﻿/, ""));
  let hi = rows.findIndex(r => r.some(c => /date/i.test(c)) && r.some(c => /desc|name|merchant|payee|details|narrative|memo|particular|transaction/i.test(c)));
  if (hi < 0) throw new Error("Couldn't find the header row. The file needs columns for date, description and amount.");
  const h = rows[hi].map(x => x.trim().toLowerCase()), find = re => h.findIndex(x => re.test(x));
  const di = find(/date/), de = find(/desc|name|merchant|payee|details|narrative|memo|particular|transaction/);
  const cr = find(/credit|paid in|deposit|money in|inflow/), db = find(/debit|paid out|withdraw|money out|outflow/);
  const am = find(/^amount|amount$|value|^sum/), ty = find(/^type$|dr\/cr|cr\/dr|direction/);
  if (di < 0 || de < 0 || (am < 0 && cr < 0 && db < 0)) throw new Error("Couldn't find date, description and amount columns.");
  const year = new Date().getFullYear(), dayFirst = dayFirstIn(rows.slice(hi + 1).map(r => r[di]));
  let tx = rows.slice(hi + 1).map(r => {
    const date = parseAnyDate(r[di], year, dayFirst), desc = (r[de] || "").trim();
    let amt;
    if (cr >= 0 || db >= 0){ const c = parseMoney(r[cr]), d = parseMoney(r[db]); amt = !isNaN(c) && c !== 0 ? Math.abs(c) : !isNaN(d) && d !== 0 ? -Math.abs(d) : NaN; }
    else { amt = parseMoney(r[am]); if (ty >= 0 && !isNaN(amt)){ const t = (r[ty] || "").toLowerCase(); if (/^d|debit|out|withdraw/.test(t)) amt = -Math.abs(amt); else if (/^c|credit|in|deposit/.test(t)) amt = Math.abs(amt); } }
    return {date, desc, amt};
  }).filter(t => t.date && !isNaN(t.date) && t.desc && !isNaN(t.amt) && t.amt !== 0);
  if (!tx.length) throw new Error("No transactions found in that file.");
  if (am >= 0 && cr < 0 && db < 0 && ty < 0 && tx.every(t => t.amt > 0)){
    // one unsigned column: payroll-looking lines are money in, everything else is money out
    tx.forEach(t => { if (catOfDesc(t.desc) !== "Salary") t.amt = -t.amt; });
  }
  return tx;
}

// ---- PDF (pdf.js loaded on first use) ----
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Couldn't load the PDF reader. Check your connection and try again.")); document.head.appendChild(s); }); }
async function pdfLib(){
  if (window.pdfjsLib) return window.pdfjsLib;
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  await loadScript(base + "pdf.min.js");
  await loadScript(base + "pdf.worker.min.js"); // runs on the page itself, no separate worker needed
  return window.pdfjsLib;
}
async function pdfLines(buf, password){
  const lib = await pdfLib();
  let doc;
  try { doc = await lib.getDocument({data: buf, isEvalSupported: false, disableFontFace: true, ...(password ? {password} : {})}).promise; }
  catch(e){ if (e && e.name === "PasswordException"){ const x = new Error("locked"); x.locked = true; x.wrong = !!password; throw x; } throw e; }
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++){
    const page = await doc.getPage(p), content = await page.getTextContent(), rows = new Map();
    content.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5] / 3) * 3; if (!rows.has(y)) rows.set(y, []); rows.get(y).push({x: it.transform[4], s: it.str}); });
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, items]) => lines.push(items.sort((a, b) => a.x - b.x).map(i => i.s).join(" ").replace(/\s+/g, " ").trim()));
  }
  return lines;
}
const MONEY_RE = /\(?-?[£$€₹]?\s?(?:Rs\.?\s?)?\d{1,3}(?:,\d{3})*\.\d{2}\)?(?:\s?(?:CR|DR))?-?/gi;
const DATE_RE = /^(\d{4}[-/.]\d{1,2}[-/.]\d{1,2}|\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}|\d{1,2}[\s-][A-Za-z]{3,4}[a-z]*(?:[\s-,]+\d{2,4})?|[A-Za-z]{3,4}\.?\s\d{1,2}(?:,?\s\d{4})?)\b/;
function txFromLines(lines){
  const joined = lines.join(" "), yearHint = +((joined.match(/\b(20\d{2})\b/) || [])[1] || new Date().getFullYear());
  const dayFirst = dayFirstIn(lines.map(l => (l.match(DATE_RE) || [])[1]));
  const out = []; let prevBal = null;
  for (const line of lines){
    const dm = line.match(DATE_RE); if (!dm) continue;
    const date = parseAnyDate(dm[1], yearHint, dayFirst); if (!date || isNaN(date)) continue;
    const rest = line.slice(dm[0].length), nums = rest.match(MONEY_RE); if (!nums) continue;
    const desc = rest.replace(MONEY_RE, " ").replace(/\s+/g, " ").trim(); if (!desc || /opening|closing|brought forward|carried forward|balance b\/f|balance c\/f/i.test(desc)) { if (nums.length) prevBal = Math.abs(parseMoney(nums[nums.length-1])); continue; }
    let amt = parseMoney(nums.length >= 2 ? nums[nums.length - 2] : nums[0]);
    const bal = nums.length >= 2 ? parseMoney(nums[nums.length - 1]) : null;
    const signed = /-|\(|DR|CR/i.test(nums.length >= 2 ? nums[nums.length - 2] : nums[0]);
    if (nums.length >= 3){ // separate debit and credit columns: whichever is non-zero
      const a = parseMoney(nums[nums.length - 3]), b = parseMoney(nums[nums.length - 2]);
      amt = a && !b ? -Math.abs(a) : Math.abs(b);
    } else if (!signed){
      if (bal != null && prevBal != null && Math.abs(Math.abs(prevBal - bal) - Math.abs(amt)) < 0.02) amt = bal > prevBal ? Math.abs(amt) : -Math.abs(amt);
      else amt = catOfDesc(desc) === "Salary" || /\b(CR|CREDIT|DEPOSIT|REFUND|RECEIVED|FROM)\b/i.test(desc) ? Math.abs(amt) : -Math.abs(amt);
    } else if (/CR/i.test(nums[nums.length >= 2 ? nums.length - 2 : 0])) amt = Math.abs(amt);
    if (bal != null) prevBal = bal;
    if (amt) out.push({date, desc, amt});
  }
  if (!out.length) throw new Error("Couldn't read transactions from that PDF. Scanned statements (photos) can't be read; try the CSV export from your bank's website instead.");
  return out;
}

// ---- analysis ----
function analyzeStatement(tx, fileName, holder){
  holder = holder || [];
  tx.sort((a, b) => a.date - b.date);
  const first = tx[0].date, last = tx[tx.length - 1].date;
  const months = Math.max(1, Math.round((last - first) / (30.44 * DAY) + 0.5));
  const group = list => { const g = {}; list.forEach(t => { const k = merchantKey(t.desc); (g[k] = g[k] || []).push(t); }); return g; };
  const cadenceOf = list => {
    if (list.length < 2) return null;
    const gaps = list.slice(1).map((t, i) => (t.date - list[i].date) / DAY), amts = list.map(t => Math.abs(t.amt));
    const steady = Math.max(...amts) / Math.min(...amts) <= 1.25, avgGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    if (steady && gaps.every(g => g >= 25 && g <= 36)) return "monthly";
    if (steady && gaps.every(g => g >= 12 && g <= 16)) return "biweekly";
    if (steady && gaps.every(g => g >= 6 && g <= 8)) return "weekly";
    if (steady && gaps.every(g => g >= 350 && g <= 380)) return "yearly";
    if (avgGap >= 25 && avgGap <= 36 && steady) return "monthly";
    return null;
  };
  const perMonth = (amt, cad) => cad === "weekly" ? amt * 52 / 12 : cad === "biweekly" ? amt * 26 / 12 : cad === "yearly" ? amt / 12 : amt;
  // transfers, remittances and cash are set aside first
  const isMove = t => catOfDesc(t.desc) === "Transfers";
  const moveTx = tx.filter(isMove); tx = tx.filter(t => !isMove(t));
  const mv = {sent: {}, recv: {}, remit: {}, cashOut: 0, cashIn: 0};
  moveTx.forEach(t => { const kind = moveKind(t.desc, t.amt), a = Math.abs(t.amt);
    if (kind === "cash"){ if (t.amt < 0) mv.cashOut += a; else mv.cashIn += a; return; }
    const key = partyKey(t.desc) || "UNNAMED", bucket = kind === "remit" ? mv.remit : t.amt < 0 ? mv.sent : mv.recv;
    (bucket[key] = bucket[key] || []).push(t); });
  const sumOf = list => list.reduce((a, t) => a + Math.abs(t.amt), 0), mo = v => r2(v / months);
  const own = [], both = [];
  [...new Set([...Object.keys(mv.sent), ...Object.keys(mv.recv)])].forEach(k => {
    const o = mv.sent[k], i = mv.recv[k];
    if (sameName(k, holder)){ own.push({name: titleCase(k), outMonthly: mo(o ? sumOf(o) : 0), inMonthly: mo(i ? sumOf(i) : 0)}); delete mv.sent[k]; delete mv.recv[k]; }
    else if (o && i && k !== "UNNAMED"){ both.push({name: titleCase(k), outMonthly: mo(sumOf(o)), inMonthly: mo(sumOf(i))}); delete mv.sent[k]; delete mv.recv[k]; }
  });
  const people = (g, pre) => Object.entries(g).map(([k, list]) => { const regular = !!cadenceOf(list) || new Set(list.map(t => `${t.date.getFullYear()}-${t.date.getMonth()}`)).size >= Math.max(2, months);
      return {name: k === "UNNAMED" ? "No name shown" : titleCase(k), monthly: mo(sumOf(list)), count: list.length, regular, on: pre === "remit" ? true : regular}; })
    .filter(x => x.monthly >= 1).sort((a, b) => b.monthly - a.monthly);
  const moves = {holder: holder.map(w => w[0] + w.slice(1).toLowerCase()).join(" "), own, both, sent: people(mv.sent, "sent"), received: people(mv.recv, "recv"), remit: people(mv.remit, "remit"),
    cashOut: mo(mv.cashOut), cashIn: mo(mv.cashIn), cashOn: mv.cashOut > 0};
  // money in
  const credits = tx.filter(t => t.amt > 0), cg = group(credits), income = [];
  let otherIn = 0;
  for (const [k, list] of Object.entries(cg)){
    const cad = cadenceOf(list), isPay = list.some(t => catOfDesc(t.desc) === "Salary");
    const total = list.reduce((a, t) => a + t.amt, 0);
    if (isPay || (cad && catOfDesc(list[0].desc) !== "Transfers")){
      const avg = total / list.length, days = list.map(t => t.date.getDate());
      const payday = days.sort((a, b) => days.filter(v => v === b).length - days.filter(v => v === a).length)[0];
      income.push({name: titleCase(k), monthly: r2(cad ? perMonth(avg, cad) : total / months), cadence: cad || "irregular", payday, count: list.length});
    } else otherIn += total;
  }
  income.sort((a, b) => b.monthly - a.monthly);
  const monthlyIncome = r2(income.reduce((a, s) => a + s.monthly, 0));
  // money out
  const debits = tx.filter(t => t.amt < 0), dg = group(debits), subs = [], bills = [], taxes = [], spend = {}, spendTop = {};
  for (const [k, list] of Object.entries(dg)){
    const cat = catOfDesc(list[0].desc), cad = cadenceOf(list), amts = list.map(t => -t.amt), total = amts.reduce((a, b) => a + b, 0);
    const lastAmt = amts[amts.length - 1];
    if (cat === "Tax"){ taxes.push({name: titleCase(k), total: r2(total), monthly: r2(total / months)}); continue; }
    if (cad && BILL_CAT.has(cat)){ bills.push({name: titleCase(k), cat, monthly: r2(perMonth(lastAmt, cad)), cadence: cad}); continue; }
    if (cat === "Subscriptions" || (cad && cat !== "Groceries" && cat !== "Transfers" && cat !== "Transport" && lastAmt < 150)){
      if (cat === "Subscriptions" || cad){
        subs.push({name: titleCase(k), price: r2(lastAmt), cycle: cad === "yearly" ? "yr" : "mo", monthly: r2(perMonth(lastAmt, cad || "monthly")), since: isoOf(list[0].date), lastCharge: isoOf(list[list.length - 1].date), charges: list.length, paid: r2(total), cadence: cad || "monthly"});
        continue;
      }
    }
    spend[cat] = (spend[cat] || 0) + total; (spendTop[cat] = spendTop[cat] || []).push([titleCase(k), total]);
  }
  subs.sort((a, b) => b.monthly - a.monthly); bills.sort((a, b) => b.monthly - a.monthly);
  const spending = Object.entries(spend).map(([cat, total]) => ({cat, name: CAT_LABEL[cat] || cat, monthly: r2(total / months), env: NEEDS_CATS.has(cat) ? "needs" : "misc", top: (spendTop[cat] || []).sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0])})).filter(x => x.monthly >= 1).sort((a, b) => b.monthly - a.monthly);
  const taxMonthly = r2(taxes.reduce((a, t) => a + t.monthly, 0));
  const out = r2(bills.reduce((a, b) => a + b.monthly, 0) + subs.reduce((a, s) => a + s.monthly, 0) + spending.reduce((a, s) => a + s.monthly, 0) + taxMonthly);
  return {fileName, count: tx.length + moveTx.length, moves, first: isoOf(first), last: isoOf(last), months, income, monthlyIncome, otherIn: r2(otherIn / months), subs, bills, taxes, taxMonthly, spending, monthlyOut: out};
}

// ---- apply to the plan ----
function applyStatement(R, mode){
  const expenses = [
    ...R.bills.map(b => ({id: uid(), name: b.name, amount: b.monthly, env: "needs", source: "statement"})),
    ...(R.taxMonthly ? [{id: uid(), name: "Tax payments", amount: R.taxMonthly, env: "needs", source: "statement"}] : []),
    ...R.spending.filter(s => s.cat !== "Transfers").map(s => ({id: uid(), name: s.name, amount: s.monthly, env: s.env, source: "statement"})),
    ...(R.moves ? R.moves.sent.filter(x => x.on).map(x => ({id: uid(), name: `Sent to ${x.name}`, amount: x.monthly, env: "misc", source: "statement"})) : []),
    ...(R.moves && R.moves.cashOn && R.moves.cashOut > 0 ? [{id: uid(), name: "Cash withdrawals", amount: R.moves.cashOut, env: "misc", source: "statement"}] : [])
  ];
  const incoming = R.moves ? [...R.moves.remit.filter(x => x.on).map(x => ({name: `From abroad: ${x.name}`, amount: x.monthly})), ...R.moves.received.filter(x => x.on).map(x => ({name: `From ${x.name}`, amount: x.monthly}))] : [];
  incoming.forEach(x => { const old = extras().find(e => e.name.toLowerCase() === x.name.toLowerCase());
    if (old) old.amount = x.amount; else extras().push({id: uid(), name: x.name, kind: "other", when: "any", amount: x.amount, got: [], source: "statement"}); });
  const subs = R.subs.map(s => ({id: uid(), name: s.name, price: s.price, cycle: s.cycle, last: null, group: "", env: "misc", keep: "auto", since: s.since, charges: s.charges, paid: s.paid, lastCharge: s.lastCharge, source: "statement"}));
  subs.forEach(s => setRenewalFrom(s, s.lastCharge));
  if (mode === "replace"){
    if (R.monthlyIncome) S.income = R.monthlyIncome;
    S.expenses = expenses; S.subs = subs;
    S.swaps = S.swaps.filter(w => linkedItem(w));
    if (S.example) S.codes = S.codes.filter(c => c.mine);  // the sample promo codes leave with the example month
    S.example = false;
  } else {
    if (R.monthlyIncome && !S.income) S.income = R.monthlyIncome;
    const has = (list, n) => list.some(x => x.name.toLowerCase() === n.toLowerCase());
    expenses.forEach(e => { if (!has(S.expenses, e.name)) S.expenses.push(e); });
    subs.forEach(s => { const old = S.subs.find(x => x.name.toLowerCase() === s.name.toLowerCase()); if (old){ Object.assign(old, {since: s.since, charges: s.charges, paid: s.paid, lastCharge: s.lastCharge}); if (!old.renewDay && !old.renewDate) setRenewalFrom(old, s.lastCharge); } else S.subs.push(s); });
  }
  S.payday = R.income[0] ? R.income[0].payday : S.payday;
  S.imported = {file: R.fileName, when: isoDaysAgo(0), from: R.first, to: R.last};
  S.hideNote = true;
  save();
}

async function readStatementFile(file, password){
  const name = file.name || "statement";
  if (/\.pdf$/i.test(name) || file.type === "application/pdf"){
    const buf = await file.arrayBuffer();
    const lines = await pdfLines(buf, password), R = analyzeStatement(txFromLines(lines), name, holderName(lines.join("\n"))); R.cur = detectCurrency(lines.join(" ")); return R;
  }
  const text = await file.text(), R = analyzeStatement(txFromCSV(text), name, holderName(text)); R.cur = detectCurrency(text); return R;
}
// ---- statements in another currency ----
// Guess the statement's currency from symbols and codes in the file. Dollars and rupees are shared by several
// currencies, so those only count as different when the plan is not in one of them.
const CUR_FAMILY = {USD: "$", CAD: "$", AUD: "$", INR: "Rs", PKR: "Rs"};
function detectCurrency(text){
  const t = String(text).slice(0, 200000), n = re => (t.match(re) || []).length;
  const score = {GBP: n(/£|\bGBP\b/g), EUR: n(/€|\bEUR\b/g), AED: n(/\bAED\b|\bDhs?\b/g), USD: n(/\bUSD\b|US\$/g), CAD: n(/\bCAD\b|C\$|CA\$/g), AUD: n(/\bAUD\b|A\$|AU\$/g), INR: n(/₹|\bINR\b/g), PKR: n(/\bPKR\b/g)};
  const dollars = n(/\$/g), rupees = n(/\bRs\.?\s?\d/g);
  const best = Object.entries(score).sort((a, b) => b[1] - a[1])[0];
  if (best[1] >= 2 && best[1] >= dollars / 2) return best[0];
  if (dollars >= 2) return CUR_FAMILY[S.cur] === "$" ? S.cur : "USD";
  if (rupees >= 2) return CUR_FAMILY[S.cur] === "Rs" ? S.cur : "PKR";
  return best[1] >= 1 ? best[0] : null;
}
const curName = c => (CURRENCIES.find(x => x[0] === c) || [c, c])[1];
function fxScaled(R){  // the statement's numbers in the plan's currency
  const fx = STMT.fx, k = fx && fx.mode === "convert" ? numv(fx.rate) : 1; if (!k || k === 1) return R;
  const m = v => r2((+v || 0) * k);
  return {...R, monthlyIncome: m(R.monthlyIncome), otherIn: m(R.otherIn), taxMonthly: m(R.taxMonthly), monthlyOut: m(R.monthlyOut),
    income: R.income.map(x => ({...x, monthly: m(x.monthly)})), subs: R.subs.map(x => ({...x, price: m(x.price), monthly: m(x.monthly), paid: m(x.paid)})),
    bills: R.bills.map(x => ({...x, monthly: m(x.monthly)})), taxes: R.taxes.map(x => ({...x, total: m(x.total), monthly: m(x.monthly)})), spending: R.spending.map(x => ({...x, monthly: m(x.monthly)})),
    moves: R.moves && {...R.moves, cashOut: m(R.moves.cashOut), cashIn: m(R.moves.cashIn), sent: R.moves.sent.map(x => ({...x, monthly: m(x.monthly)})), received: R.moves.received.map(x => ({...x, monthly: m(x.monthly)})), remit: R.moves.remit.map(x => ({...x, monthly: m(x.monthly)})),
      own: R.moves.own.map(x => ({...x, inMonthly: m(x.inMonthly), outMonthly: m(x.outMonthly)})), both: R.moves.both.map(x => ({...x, inMonthly: m(x.inMonthly), outMonthly: m(x.outMonthly)}))}};
}
const fxReady = () => { const fx = STMT.fx; return !fx || fx.mode !== "convert" || numv(fx.rate) > 0; };
function fxCard(){
  const fx = STMT.fx, R = STMT.result;
  if (!fx) return `<button class="link plain small" type="button" data-fx-open style="align-self:center">Is this statement in another currency?</button>`;
  const opt = (mode, title, body) => `<label class="fx-opt${fx.mode === mode ? " on" : ""}"><input type="radio" name="fxmode" value="${mode}" ${fx.mode === mode ? "checked" : ""}><span><b>${title}</b>${body || ""}</span></label>`;
  return `<section class="card fx-card"><h3>${R.cur && R.cur === fx.from ? `This statement looks like it’s in ${esc(curName(fx.from))}s.` : "Which currency is this statement in?"}</h3>

    <label class="field"><span>Statement currency</span><select data-fx-from>${curOptions(fx.from, S.cur)}</select></label>
    ${opt("convert", `Convert to ${S.cur}`, `<span class="fx-rate">1 ${esc(fx.from)} = <input data-fx-rate inputmode="decimal" enterkeyhint="done" placeholder="rate" value="${esc(fx.rate)}" aria-label="How many ${S.cur} one ${esc(fx.from)} is worth"> ${S.cur}</span><small class="muted">Use the rate your bank gave you. KeepWise does not look rates up.</small>`)}

// ---- review screen ----
const monthsLabel = iso => { if (!iso) return ""; const [y, m] = iso.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleString("en-US", {month: "short", year: "numeric"}); };
function paidFor(s){ if (!s.since) return ""; const [y, m, d] = s.since.split("-").map(Number); const mo = Math.max(1, Math.round((todayMid() - new Date(y, m - 1, d)) / (30.44 * DAY))); return `Paying since ${monthsLabel(s.since)} · ${s.charges} charge${s.charges === 1 ? "" : "s"} · ${fmt(s.paid)} so far`; }
V.importReview = () => {

function reviewPick(){
  const asked = UI.survey && S.subs.find(x => x.id === UI.survey); if (asked) return asked;   // opened from a note or a notification

// These are rules of thumb matched to names on the person's own list. The number is a rough share of today's price,
// never a real quote, and every idea says so. Nothing is looked up online.
const SWAP_IDEAS = [
  {re: /netflix|hulu|disney|hbo|\bmax\b|peacock|paramount|prime video|apple tv|discovery|crunchyroll|youtube (premium|tv)/i, ideas: [["ads", "Plan with ads", "The same shows with adverts usually cost much less.", 0.55], ["rotate", "Keep it half the year", "Subscribe for the months you watch and pause the rest.", 0.5]]},
  {re: /spotify|apple music|youtube music|tidal|deezer|amazon music|pandora/i, ideas: [["share", "Share a Duo or Family plan", "Split a shared plan with the people you live with.", 0.6]]},
  {re: /icloud|google one|dropbox|onedrive|google storage/i, ideas: [["tier", "Smaller storage plan", "Clear old photos and files, then drop one tier.", 0.4]]},
  {re: /adobe/i, ideas: [["single", "Single app plan", "Pay only for the apps you open.", 0.45]]},
  {re: /audible|kindle unlimited|scribd|everand/i, ideas: [["library", "Your library’s app", "Many public libraries lend audiobooks and e-books free.", 0]]},
  {re: /gym|fitness|equinox|peloton|classpass|crunch/i, ideas: [["basic", "Basic membership", "Drop the extras you do not use.", 0.5]]},
  {re: /hellofresh|blue apron|home chef|meal kit|factor/i, ideas: [["cook", "Cook the same meals yourself", "Buy the ingredients on your grocery run.", 0.4]]},
  {re: /dashpass|uber one|instacart|grubhub|deliveroo/i, ideas: [["pause", "Pause it and pay per order", "It pays off only if you order most weeks.", 0]]},
  {re: /times|journal|\bpost\b|economist|guardian|athletic/i, ideas: [["promo", "Ask for the offer rate", "Publishers often give a lower rate if you ask.", 0.5]]},
  {bill: true, re: /phone|mobile|verizon|at&t|t-mobile|vodafone/i, ideas: [["prepaid", "Prepaid or SIM-only plan", "Often the same network for less.", 0.6]]},
  {bill: true, re: /internet|wi-?fi|broadband|comcast|xfinity|spectrum|fib(er|re)/i, ideas: [["ask", "Ask for a better rate", "Call and ask what they can offer to keep you.", 0.8]]},
  {bill: true, re: /insurance/i, ideas: [["quotes", "Get two more quotes", "Prices vary widely for the same cover.", 0.85]]},
];
const YEARLY_IDEA = ["yearly", "Pay yearly instead of monthly", "A yearly plan is often cheaper than twelve monthly payments.", 0.85];
function swapIdeas(){
  const skip = S.swapSkip || {}, taken = new Set(S.swaps.map(w => w.link)), out = [];
  const add = (link, name, cost, list) => list.forEach(([k, alt, why, f]) => { const key = `${link}:${k}`, altCost = r2(cost * f);
    if (!skip[key] && !taken.has(link) && cost - altCost >= 2) out.push({key, link, name, alt, why, altCost, save: r2(cost - altCost)}); });
  S.subs.filter(x => x.keep !== "drop" && !isOurs(x)).forEach(x => { const rule = SWAP_IDEAS.find(r => !r.bill && r.re.test(x.name)), cost = subMonthly(x);
    add(`sub:${x.id}`, x.name, cost, rule ? rule.ideas : x.cycle === "mo" && cost >= 5 ? [YEARLY_IDEA] : []); });
  S.expenses.forEach(x => { const rule = SWAP_IDEAS.find(r => r.bill && r.re.test(x.name)); if (rule) add(`expense:${x.id}`, x.name, +x.amount || 0, rule.ideas); });
  const seen = new Set();  // one idea per thing you pay for, the biggest first
  return out.sort((a, b) => b.save - a.save).filter(i => !seen.has(i.link) && seen.add(i.link));
}

/* ================= renewals ================= */
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
function nextRenewal(s){
  const t = todayMid();
  if (s.cycle === "yr"){
    if (!s.renewDate) return null; const [y, m, d] = s.renewDate.split("-").map(Number); let r = new Date(y, m - 1, d);
    while (r < t) r.setFullYear(r.getFullYear() + 1); return r;
  }
  if (!s.renewDay) return null;
  let r = new Date(t.getFullYear(), t.getMonth(), Math.min(s.renewDay, daysInMonth(t.getFullYear(), t.getMonth())));
  if (r < t) r = new Date(t.getFullYear(), t.getMonth() + 1, Math.min(s.renewDay, daysInMonth(t.getFullYear(), t.getMonth() + 1)));
  return r;
}
const dateWithYear = (d, always) => d.toLocaleDateString("en-US", always || d.getFullYear() !== new Date().getFullYear() ? {month: "short", day: "numeric", year: "numeric"} : {month: "short", day: "numeric"});
const daysUntil = d => Math.round((d - todayMid()) / DAY);
const whenLabel = n => n === 0 ? "Today" : n === 1 ? "Tomorrow" : `In ${n} days`;
function setRenewalFrom(s, iso){  // iso date of a charge
  if (!iso) return; const [y, m, d] = iso.split("-").map(Number);
  if (s.cycle === "yr") s.renewDate = isoOf(new Date(y + 1, m - 1, d)); else s.renewDay = d;
}

  const total = soon.filter(x => x.s.keep !== "drop").reduce((a, x) => a + x.s.price, 0);
  return `<section class="card"><div class="inline" style="justify-content:space-between;align-items:baseline"><h2>Coming up</h2><span class="muted small">Next 7 days</span></div>

};

/* ================= files: backup, restore, saving ================= */
async function saveFile(blob, name){
  try {
    const file = new File([blob], name, {type: blob.type});
    if (IN_APP && navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: name}); return true; }
  } catch(e){ if (e && e.name === "AbortError") return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true;
}
async function downloadBackup(){
  const data = JSON.parse(JSON.stringify(S)); delete data.tab;
  const body = JSON.stringify({app: "KeepWise", kind: "backup", version: 1, made: new Date().toISOString(), data}, null, 1);
  const ok = await saveFile(new Blob([body], {type: "application/json"}), `keepwise-backup-${isoDaysAgo(0)}.json`);
  if (ok){ S.lastBackup = isoDaysAgo(0); save(); render(true); toast("Backup saved. Keep the file somewhere safe."); }
}
function readBackup(text){
  let j; try { j = JSON.parse(text); } catch(e){ throw new Error("That file isn’t a KeepWise backup."); }
  const d = j && j.app === "KeepWise" && j.kind === "backup" ? j.data : null;
  if (!d || d.v !== 1 || !Array.isArray(d.expenses) || !Array.isArray(d.subs) || !Array.isArray(d.splits) || typeof d.env !== "object")
    throw new Error("That file isn’t a KeepWise backup.");
  return {data: d, made: j.made};
}

  return "KEEPWISE:" + btoa(unescape(encodeURIComponent(JSON.stringify({app: "KeepWise", kind: "backup", version: 1, made: new Date().toISOString(), data})))); };
function readMoveCode(text){
  const m = String(text || "").replace(/\s+/g, "").match(/KEEPWISE:([A-Za-z0-9+/=]+)/);
  if (!m) throw new Error("That isn’t KeepWise data. Go back to your browser and tap Copy my data again.");
  let json; try { json = decodeURIComponent(escape(atob(m[1]))); } catch(e){ throw new Error("That copy is incomplete. Tap Copy my data again in your browser."); }
  return readBackup(json);
}
async function moveCopy(){

  if (!ok) try { const ta = document.createElement("textarea"); ta.value = code; ta.style.cssText = "position:fixed;opacity:0"; document.body.append(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch(e){}
  if (!ok){ toast("Couldn’t copy. Use Download a backup on the Plan tab instead."); return; }

  if (x.when === "twice"){ const c = []; for (let m = 0; m < 2; m++){ const y = t.getFullYear(), mo = t.getMonth() + m, dim = daysInMonth(new Date(y, mo, 1).getFullYear(), new Date(y, mo, 1).getMonth()); twiceDays(x).forEach(d => c.push(new Date(y, mo, Math.min(d, dim)))); }

/* ================= your month and your paydays ================= */
// A month normally runs from the 1st. It can start on another day (for example the 25th, payday), and is then named
// after the month most of it falls in: 25 Oct to 24 Nov is "November".
function planPeriodNow(){ const now = new Date(), P0 = periodOf(now); return Math.round((P0.end - todayMid()) / DAY) <= 2 ? periodOf(new Date(P0.end.getFullYear(), P0.end.getMonth(), P0.end.getDate() + 1)) : P0; }
const monthStartDay = () => Math.min(28, Math.max(1, +S.monthStart || 1));
function periodOf(date){
  const ms = monthStartDay(), d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const start = d.getDate() >= ms ? new Date(d.getFullYear(), d.getMonth(), ms) : new Date(d.getFullYear(), d.getMonth() - 1, ms);
  const end = new Date(start.getFullYear(), start.getMonth() + 1, ms - 1);
  const named = ms <= 15 ? start : new Date(start.getFullYear(), start.getMonth() + 1, 1);
  return {start, end, key: `${named.getFullYear()}-${String(named.getMonth() + 1).padStart(2, "0")}`, name: named.toLocaleString("en-US", {month: "long"})};
}
function periodForKey(k){ const [y, m] = k.split("-").map(Number), ms = monthStartDay(); return periodOf(ms <= 15 ? new Date(y, m - 1, ms) : new Date(y, m - 2, ms)); }

const dayMonth = d => d.toLocaleDateString("en-US", {month: "short", day: "numeric"});
const rangeText = p => `${dayMonth(p.start)} to ${dayMonth(p.end)}`;

const PAY_WHEN = [["monthly","Once a month"],["twice","Twice a month"],["biweekly","Every 2 weeks"],["weekly","Every week"]];
const PAY_BASE = {monthly: 1, twice: 2, biweekly: 2, weekly: 4};  // paychecks in an ordinary month; any more is a bonus
const payOn = () => !!(S.pay && S.pay.when);
const payBase = () => PAY_BASE[(S.pay || {}).when] || 1;
function paydaysBetween(a, b){  // every payday from a to b, both included
  const p = S.pay || {}, out = [], clamp = (y, m, day) => new Date(y, m, Math.min(day, daysInMonth(y, m)));
  if (p.when === "monthly" || p.when === "twice"){
    const days = [p.day, p.when === "twice" ? p.day2 : null].filter(Boolean);
    for (const c = new Date(a.getFullYear(), a.getMonth(), 1); c <= b; c.setMonth(c.getMonth() + 1)) days.forEach(day => { const d = clamp(c.getFullYear(), c.getMonth(), +day); if (d >= a && d <= b) out.push(d); });
  } else if (p.when === "weekly" && p.wd != null){
    const d = new Date(a); d.setDate(d.getDate() + ((+p.wd - d.getDay() + 7) % 7)); for (; d <= b; d.setDate(d.getDate() + 7)) out.push(new Date(d));
  } else if (p.when === "biweekly" && p.next){
    const [y, m, dd] = p.next.split("-").map(Number), d = new Date(y, m - 1, dd);
    while (d > a) d.setDate(d.getDate() - 14); while (d < a) d.setDate(d.getDate() + 14);
    for (; d <= b; d.setDate(d.getDate() + 14)) out.push(new Date(d));

  return out.sort((x, y) => x - y);
}

/* ================= tell them (messages you send yourself; KeepWise sends nothing) ================= */
// After a split on this phone is added, changed, deleted or settled, KeepWise writes a short message for each person in it.
// You send it from your own apps (the phone's share sheet), or copy it. Nothing leaves the phone unless you send it.
const tellOthers = x => x ? [...new Set([x.paidBy, ...Object.keys(x.parts || {})])].filter(id => id !== "me") : [];
const tellName = id => (S.people.find(p => p.id === id) || {}).name || "Someone";
function tellLine(x, id){  // what one split means for one person, written from you to them
  const sh = shares(x), mine = sh.me || 0, theirs = sh[id] || 0;
  if (x.method === "borrow"){ const who = Object.keys(x.parts)[0];
    return x.paidBy === "me" ? (who === id ? `I lent you ${fmt(x.amount)}` : `I lent ${tellName(who)} ${fmt(x.amount)}`)
      : x.paidBy === id ? `you lent ${who === "me" ? "me" : tellName(who)} ${fmt(x.amount)}` : `${tellName(x.paidBy)} lent you ${fmt(x.amount)}`; }
  if (x.paidBy === "me") return `I paid ${fmt(x.amount)}. Your share is ${fmt(theirs)}`;
  if (x.paidBy === id) return mine > 0 ? `you paid ${fmt(x.amount)}. My share is ${fmt(mine)}, so I owe you ${fmt(mine)}` : `you paid ${fmt(x.amount)}`;
  return `${tellName(x.paidBy)} paid ${fmt(x.amount)}. Your share is ${fmt(theirs)}, owed to ${tellName(x.paidBy)}`;
}
// Every message carries the link: each one sent is how the next person hears about KeepWise.
const TELL_FOOT = "\n\nSplit bills free with KeepWise: https://mykeepwise.com";
const tellFootHtml = `<span class="tell-foot">Split bills free with KeepWise: mykeepwise.com</span>`;
function tellGroup(x, kind){
  if (kind === "delete") return `${x.title} was removed. It no longer counts for anyone.`;
  const sh = shares(x), who = id => id === "me" ? "Me" : tellName(id);
  return `${x.title}${kind === "edit" ? " (updated)" : ""}: ${fmt(x.amount)}, paid by ${x.paidBy === "me" ? "me" : tellName(x.paidBy)}.\n${Object.keys(sh).map(id => `${who(id)}: ${fmt(sh[id])}`).join("\n")}`;
}
function tellAbout(kind, x, old){  // kind: add, edit, delete
  if (shared() || !x) { UI.tell = null; return; }
  const now = tellOthers(x), before = old ? tellOthers(old) : [], rows = [];
  now.forEach(id => {
    let text;
    if (kind === "delete") text = `${x.title} was removed. It no longer counts between us.`;
    else if (kind === "edit"){ const was = before.includes(id) ? (shares(old)[id] || 0) : null, is = shares(x)[id] || 0;
      text = `${x.title} was updated: ${tellLine(x, id)}.${was != null && Math.abs(was - is) > 0.005 && x.method !== "borrow" ? ` Before, your share was ${fmt(was)}.` : ""}`; }
    else text = `${x.title}: ${tellLine(x, id)}.`;
    rows.push({id, name: tellName(id), text});
  });
  before.filter(id => !now.includes(id)).forEach(id => rows.push({id, name: tellName(id), text: `You are no longer part of ${old.title}. It no longer counts between us.`}));
  if (!rows.length){ UI.tell = null; return; }
  UI.tell = {kind, title: x.title, at: kind === "edit" ? x.id : null, rows, group: now.length >= 2 && x.method !== "borrow" ? tellGroup(x, kind) : null, each: false};
}
function tellSettled(pid, amount, gotPaid, left){
  if (shared()){ UI.tell = null; return; }
  const name = tellName(pid);
  UI.tell = {kind: "settle", title: name, at: null, group: null, each: false,
    rows: [{id: pid, name, text: left > 0.005 ? (gotPaid ? `Got your ${fmt(amount)}, thank you. ${fmt(left)} is still to come.` : `I paid you ${fmt(amount)}. I still owe you ${fmt(left)}.`)
      : gotPaid ? `Got your ${fmt(amount)}, thank you. We are all square.` : `I paid you ${fmt(amount)}. We are all square.`}]};
}
const TELL_HEAD = {add: (t, who) => who ? `Let ${who} know about ${t}` : `Let everyone in ${t} know`, edit: (t, who) => `${t} changed. Let ${who || "them"} know`, delete: (t, who) => `${t} was deleted. Let ${who || "them"} know`, settle: t => `Let ${t} know`};
function tellCard(){
  const t = UI.tell; if (!t || splitDraft) return "";
  const one = t.rows.length === 1, row = r => `<div class="tell-row" data-tell-id="${esc(r.id)}"><div class="tell-txt"><b>${esc(r.name)}</b><span class="muted small">${esc(r.text)}</span></div><button class="btn small${r.sent ? " done" : ""}" type="button" data-tell-send aria-label="Send to ${esc(r.name)}">${r.sent ? "✓ Sent" : "Send"}</button></div>`;
  return `<section class="card tell-card" data-tell><div class="inline" style="justify-content:space-between"><p class="label">Tell them</p><button class="link plain small" type="button" data-tell-close>${t.rows.every(r => r.sent) || t.groupSent ? "Done" : "Not now"}</button></div>
    <h3>${esc(TELL_HEAD[t.kind](t.title, one ? firstWord(t.rows[0].name) : ""))}</h3>
    ${t.group ? `<div class="tell-msg">${esc(t.group).replace(/\n/g, "<br>")}${tellFootHtml}</div>
      <button class="btn primary" type="button" data-tell-all>${I.share}${t.groupSent ? "Sent. Send again" : "Send to everyone"}</button>
      ${t.each ? `<div class="tell-rows">${t.rows.map(row).join("")}</div>` : `<button class="link small" type="button" data-tell-each style="align-self:center">Or tell each person separately</button>`}`
    : one ? `<div class="tell-msg">${esc(t.rows[0].text)}${tellFootHtml}</div><div data-tell-id="${esc(t.rows[0].id)}"><button class="btn primary" type="button" data-tell-send>${I.share}${t.rows[0].sent ? "Sent. Send again" : `Send to ${esc(firstWord(t.rows[0].name))}`}</button></div>`
    : `<div class="tell-rows">${t.rows.map(row).join("")}</div>`}
    <p class="muted small">KeepWise does not message anyone. You send this yourself, from your own apps.</p></section>`;
}
const firstWord = n => String(n || "").trim().split(/\s+/)[0] || "them";
async function tellSend(text, name){
  text += TELL_FOOT;
  try { if (navigator.share){ await navigator.share({text}); return true; } }
  catch(e){ if (e && e.name === "AbortError") return false; }
  const said = () => toast(`Copied. Paste it into a message${name ? " to " + name : ""}.`);
  try { await navigator.clipboard.writeText(text); said(); return true; } catch(e){}
  try { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.append(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); if (ok){ said(); return true; } } catch(e){}
  toast("Couldn’t share or copy that. Press and hold the message to copy it."); return false;
}

/* ================= loans and debt ================= */
// A loan is a payment with a finish line. The payment counts toward Expenditures until the end date passes.
// With a total and no end date, the finish is worked out from the payments alone, without interest, and says so.
// Giving: money you choose to give regularly. You say who it goes to; KeepWise lists no organisations, takes no payment
// and sends nothing anywhere. It is a line in your plan, counted under Miscellaneous at its monthly cost.
const GIVE_CAUSES = [["children","Children"],["orphans","Orphans"],["veterans","Veterans"],["relief","Emergency relief"],["health","Health"],["education","Education"],["faith","Faith"],["family","Family and community"],["animals","Animals"],["other","Other"]];
const GIVE_EVERY = [["mo","Every month"],["wk","Every week"],["2x","Twice a month"],["yr","Every year"]];

    <label class="field"><span>Amount each time</span><span class="money-in"><em>${esc(sym())}</em><input name="amount" inputmode="decimal" enterkeyhint="done" placeholder="0" value="${esc(d.amount)}"></span></label>

}
OUT.giving = () => { if (!GIVING_ON) return ""; const list = S.giving || [], tot = givingMonthly();

    ${infoTip("giving", "Money you give regularly, to anyone you choose. It counts under Miscellaneous at its monthly cost. KeepWise does not collect or send donations.")}
    ${list.map(g => UI.giveEdit === g.id ? `<div class="inc-row editing" data-give="${g.id}">${giveForm(g)}</div>` : `<div class="inc-row" data-give="${g.id}"><div class="row-top"><div><div class="name">${esc(g.name || giveCause(g.cause))}</div><div class="muted small">${esc(giveCause(g.cause))} · ${esc(giveEvery(g.every)[1].toLowerCase())}</div></div><div style="text-align:right"><div class="name tnum">${fmt(g.amount)}</div>${g.every === "mo" ? "" : `<div class="muted small tnum">${fmt(giveMonthly(g))}/mo</div>`}</div></div>
      <button class="link plain small" type="button" data-give-edit aria-label="Edit ${esc(g.name || giveCause(g.cause))}" style="align-self:flex-end">Edit</button></div>`).join("")}
    ${UI.giveAdd ? `<div class="inc-row editing">${giveForm(null)}</div>` : `<button class="btn" type="button" data-give-add>${I.plus}Add giving</button>`}
    ${list.length ? `<p class="muted small">That is ${fmt(r2(tot * 12))} a year.</p>` : UI.giveAdd ? "" : `<p class="muted small">Charity, family support, your place of worship: anything you give on a regular basis.</p>`}</section>`; };
const LOAN_KINDS = [["bank","Bank loan"],["personal","Personal loan"],["student","Student debt"],["card","Credit card"],["car","Car loan"],["home","Mortgage"],["other","Other debt"]];
const LOAN_EVERY = [["mo","Every month","a month"],["wk","Every week","a week"],["2wk","Every 2 weeks","every 2 weeks"],["yr","Every year","a year"]];
const CARD_TYPES = ["Visa", "Mastercard", "American Express", "Discover", "UnionPay", "Other"];
const loanKind = k => (LOAN_KINDS.find(x => x[0] === k) || LOAN_KINDS[6])[1];
const loanList = () => S.loans || (S.loans = []);
const loanMonthly = l => { const a = +l.pay || 0, fee = l.kind === "card" ? (+l.fee || 0) / 12 : 0; return fee + (l.every === "wk" ? a * 52 / 12 : l.every === "2wk" ? a * 26 / 12 : l.every === "yr" ? a / 12 : a); };
const loanDone = l => !!l.end && l.end < isoDaysAgo(0);
const loansMonthly = () => r2((S.loans || []).filter(l => !loanDone(l)).reduce((a, l) => a + loanMonthly(l), 0));
function loanFinish(l){
  const t = todayMid();
  if (l.end){ const [y, m, d] = l.end.split("-").map(Number), dt = new Date(y, m - 1, d); return {date: dt, months: Math.max(0, Math.round((dt - t) / (30.44 * DAY))), est: false}; }
  const mth = loanMonthly(l); if (+l.total > 0 && mth > 0){ const n = Math.ceil(l.total / mth); return {date: new Date(t.getFullYear(), t.getMonth() + n, 1), months: n, est: true}; }
  return null;
}
// Interest is worked out only when every number is there and makes sense: a payment, the amount left, whole installments
// left and a real end date still ahead. It is the yearly rate at which those payments exactly clear the amount left.
const LOAN_PPY = {mo: 12, wk: 52, "2wk": 26, yr: 1};
function loanRate(l){
  const A = +l.pay, P = +l.total, n = +l.left, end = String(l.end || "");
  if (!(A > 0) || !(P > 0) || !(n >= 1) || !Number.isInteger(n) || n > 1200) return null;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(end) || isNaN(new Date(end + "T00:00:00").getTime()) || end < isoDaysAgo(0)) return null;
  const paid = A * n; if (paid < P - 0.005) return {short: true};
  if (paid - P < 0.005) return {apr: 0, paid, cost: 0};
  let lo = 0, hi = 1; const pv = r => A * (1 - Math.pow(1 + r, -n)) / r;
  while (pv(hi) > P && hi < 64) hi *= 2;
  for (let i = 0; i < 80; i++){ const mid = (lo + hi) / 2; if (pv(mid) > P) lo = mid; else hi = mid; }
  const apr = (lo + hi) / 2 * (LOAN_PPY[l.every] || 12) * 100;
  return isFinite(apr) && apr < 1000 ? {apr: Math.round(apr * 10) / 10, paid, cost: r2(paid - P)} : null;
}
function loanCalc(f){ const v = n => String(f.elements[n] ? f.elements[n].value : "").trim(), leftRaw = v("left");
  const d = {pay: numv(v("pay")), total: numv(v("total")), left: /^\d{1,4}$/.test(leftRaw) ? +leftRaw : 0, end: v("end"), every: v("every")};
  f.elements.rate.value = loanRateText(d); const n = f.querySelector("[data-loan-ratenote]"); if (n) n.textContent = loanRateNote(d); }

  : r.apr === 0 ? "Your payments add up to exactly the amount left, so there is no interest." : `You will pay ${fmt(r.paid)} in all, which is ${fmt(r.cost)} in interest.`; };

const monthYear = d => d.toLocaleDateString("en-US", {month: "short", year: "numeric"});
function loanForm(l){

      <label class="field"><span>Yearly fee <small class="muted">optional</small></span><span class="money-in"><em>${esc(sym())}</em><input name="fee" inputmode="decimal" enterkeyhint="next" placeholder="0" value="${esc(d.fee || "")}"></span></label></div>

        <div style="text-align:right">${done ? `<span class="pill ok">Paid off</span>` : `<div class="name tnum">${fmt(loanMonthly(l))}<span class="muted small">/mo</span></div>`}${+l.total > 0 && !done ? `<div class="muted small tnum">${fmt(l.total)} left</div>` : ""}</div></div>
      ${!done && (+l.left > 0 || (rate && !rate.short)) ? `<p class="small">${[+l.left > 0 ? `${l.left} installment${+l.left === 1 ? "" : "s"} left` : "", rate && !rate.short ? `interest about ${rate.apr}% a year` : ""].filter(Boolean).join(" · ").replace(/^./, c => c.toUpperCase())}</p>` : ""}
      ${done ? `<p class="muted small">Ended ${shortDate(l.end)}. It no longer counts in your plan.</p>` : f ? `<p class="small ${f.est ? "muted" : ""}">${f.est ? `About ${f.months} month${f.months === 1 ? "" : "s"} to go at this pace, around ${monthYear(f.date)}. Interest is not included.` : f.months === 0 ? `Ends ${shortDate(l.end)}.` : `Ends ${monthYear(f.date)}, ${f.months} month${f.months === 1 ? "" : "s"} from now.`}</p>` : ""}

  return `<section class="card inc-card loan-card"><div class="inline" style="justify-content:space-between;align-items:baseline"><h2 class="h-info">Loans and debt${infoBtn("loans", "About loans and debt")}</h2>${live.length ? `<span class="muted small tnum">${fmt(loansMonthly())}/mo</span>` : ""}</div>

/* ================= KeepWise Plus: what it adds and what it costs ================= */
// One screen that gathers every Plus feature, the price and the waitlist. Plus is not on sale yet, and the screen says so.

function remindQueue(c){  // who to ask about: soonest renewal first, then the most expensive

function tidyHints(){
  const H = UI.hints || (UI.hints = new Set());
  if (UI.plus || UI.account || UI.welcome != null || STMT.result || UI.inbox || TOUR.on) return;
  const hero = view.querySelector("section.hero");
  if (hero && hero.querySelector("[data-out=headline]")){
    const ps = [...hero.querySelectorAll("p.muted")].filter(p => p.textContent.trim().length > 30);
    if (ps.length){ ps.forEach(p => p.classList.add("hint-p")); hero.classList.add("has-hint"); hero.classList.toggle("hint-open", H.has("hero"));
      let b = hero.querySelector("[data-hint]");
      if (!b){ b = document.createElement("button"); b.className = "info-btn hint-btn hero-i"; b.type = "button"; b.dataset.hint = "hero"; b.setAttribute("aria-label", "About this number"); b.innerHTML = INFO_ICON; hero.appendChild(b); }
      b.setAttribute("aria-expanded", H.has("hero")); }
  }
  view.querySelectorAll("section.card").forEach(card => {
    if (card.matches(".plus-price,.plus-card,.acc-head") || card.parentElement.closest("section.card")) return;
    const h = card.querySelector("h2"); if (!h) return;
    if (!card.querySelector(".row,.line,.rows,input,select,.big,.tnum,canvas")) return;
    const ps = [...card.querySelectorAll("p.muted")].filter(p => !p.hasAttribute("data-keep") && !p.closest("form,.row,.line,label,.note,.info-tip,.field") && !p.querySelector("button,a,input,select") && p.textContent.trim().length > 30 && !/\d/.test(p.textContent));   // a line with a figure in it is information, not explanation: it stays

    ps.forEach(p => p.classList.add("hint-p")); card.classList.add("has-hint");

    card.classList.toggle("hint-open", H.has(key));

  });
}

// ---- photo: shrink to a small square so it fits in the profile record ----
function shrinkPhoto(file){
  return new Promise((ok, bad) => {
    if (!file || !/^image\//.test(file.type)) return bad(new Error("type"));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const n = 192, c = document.createElement("canvas"); c.width = c.height = n; const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", .82)); };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("read")); };
    img.src = url;
  });
}
