    if (old){ Object.assign(old, {name, amount, env}, dueBits); if (!due){ delete old.dueSince; delete old.ans; delete old.ansPaid; } } else S.expenses.push({id: uid(), name, amount, env, ...dueBits});
    UI.expAdd = false; UI.expEdit = null; save(); if (isField(document.activeElement)) document.activeElement.blur(); render(true); toast(old ? `Updated ${name}.` : `Added ${name}.`); return; }
  if (kind === "subEdit"){ const x = S.subs.find(v => v.id === UI.subEdit), name = String(fd.get("name") || "").trim(), price = numv(fd.get("price")); if (!x) return;
    if (!name || !price){ toast("Add a name and a price."); return; }
    const cycle = fd.get("cycle") === "yr" ? "yr" : "mo"; if (cycle !== x.cycle){ delete x.renewDay; delete x.renewDate; }
    Object.assign(x, {name, price, cycle, last: String(fd.get("last") || "") || x.last, group: String(fd.get("group") || "").trim()});
    UI.subEdit = null; save(); if (isField(document.activeElement)) document.activeElement.blur(); render(true); toast(`Updated ${name}.`); return; }
  if (kind === "codeEdit"){ const x = S.codes.find(v => v.id === UI.codeEdit), store = String(fd.get("store") || "").trim(), code = String(fd.get("code") || "").trim(); if (!x) return;
    if (!store || !code){ toast("Add the store and the code."); return; }
    Object.assign(x, {store, code, offer: String(fd.get("offer") || "").trim()}); UI.codeEdit = null; save(); if (isField(document.activeElement)) document.activeElement.blur(); render(true); toast(`Updated the ${store} code.`); return; }
  if (kind === "addSub"){ const name = String(fd.get("name")).trim(), price = numv(fd.get("price")); if (!name || !price){ toast("Add a name and a price."); return; }
    const ns = {id:uid(), name, price, cycle:fd.get("cycle"), last:fd.get("last") || isoDaysAgo(0), group:String(fd.get("group")||"").trim(), env:"misc", keep:"auto"};
    const rn = String(fd.get("renew") || ""), rd = +fd.get("renewDay") || 0; if (ns.cycle === "yr"){ if (rn) ns.renewDate = rn; } else if (rd >= 1 && rd <= 31) ns.renewDay = rd;
    S.subs.push(ns); save(); render(true); toast(`Added ${name}.`); return; }
  if (kind === "addSwap"){ const link = fd.get("link"), alt = String(fd.get("alt")).trim(); if (!link || !alt){ toast("Pick what you pay for and name the cheaper option."); return; }
    const [type,id] = link.split(":"), src = type === "expense" ? S.expenses.find(x=>x.id===id) : S.subs.find(x=>x.id===id);
    S.swaps.push({id:uid(), link, title: src ? src.name : "", alt, altCost:numv(fd.get("altCost")), note:"", on:false}); save(); render(true); toast("Comparison added."); return; }
  if (kind === "addCode"){ const store = String(fd.get("store")).trim(), code = String(fd.get("code")).trim(); if (!store || !code) return;
    S.codes.unshift({id:uid(), store, code, offer:String(fd.get("offer")||"").trim(), worked:0, failed:0, last:isoDaysAgo(0), mine:true}); save(); render(true); toast(`Saved the ${store} code.`); return; }
  if (kind === "addPerson"){ const name = String(fd.get("name")).trim(); if (!name){ toast("Type a name first."); return; } UI.addPerson = false; addNames([name]); return; }
  if (kind === "split"){
    const d = splitDraft, amount = numv(d.amount);
    if (!d.title.trim()){ splitErr = "Say what the split is for."; render(true); return; }
    if (amount <= 0){ splitErr = "Enter a total above zero."; render(true); return; }
    let parts = {};
    if (d.method === "borrow"){ const who = (d.borrower && d.borrower !== d.paidBy ? d.borrower : "") || (CTX().people.find(p => p.id !== d.paidBy && !p.archived) || {}).id; if (!who){ splitErr = "Add another person first."; render(true); return; } parts[who] = amount; }
    else {
      const ids = Object.keys(d.parts); if (ids.length < 2){ splitErr = "Pick at least two people."; render(true); return; }
      if (d.method === "equal") ids.forEach(id => parts[id] = 1);
      else { ids.forEach(id => parts[id] = numv(d.parts[id]));
        const sum = ids.reduce((a,id) => a + parts[id], 0);
        if (d.method === "percent" && Math.abs(sum - 100) > 0.01){ splitErr = `Percentages add up to ${r2(sum)}%. Make them total 100%.`; render(true); return; }
        if (d.method === "exact" && Math.abs(sum - amount) > 0.01){ splitErr = `Amounts add up to ${fmt(sum)}, not ${fmt(amount)}.`; render(true); return; } }
    }
    const rec = {title:d.title.trim(), amount, tag:d.tag, paidBy:d.paidBy, method:d.method, parts, icon: d.icon || ""};
    if (shared()){
      const me = SH.me, old = d.editId && SH.splits.find(y => y.id === d.editId);
      const ok = old ? await shWrite(() => { const {id, ...body} = old; return SH.db.doc("splits/" + old.id).set({...body, ...rec, updatedBy:me, updatedAt:Date.now()}); }, "Split updated. Your circle was notified.")
                     : await shWrite(() => SH.db.collection("splits").doc(uid() + uid()).set({...rec, date:isoDaysAgo(0), createdBy:me, createdAt:Date.now()}), "Split saved. Everyone in it was notified.");
      if (ok){ const wasEdit = d.editId; splitDraft = null; splitErr = ""; render(!!wasEdit); showSplitCard(wasEdit); }
      return;
    }
    const old = d.editId && S.splits.find(y => y.id === d.editId);
    const before = old ? JSON.parse(JSON.stringify(old)) : null, made = old || {id:uid(), ...rec, date:isoDaysAgo(0)};
    if (old) Object.assign(old, rec); else S.splits.push(made);
    tellAbout(old ? "edit" : "add", made, before);
    splitDraft = null; splitErr = ""; save(); render(!!old); if (old) showSplitCard(old.id);
    const tc = document.querySelector("[data-tell]"), sc = $("main");
    if (tc && !old) tc.scrollIntoView({block: "nearest"});
    else if (tc && sc){  // show as much of the prompt as fits without pushing the edited split off the top
      const card = document.querySelector(`[data-split="${old.id}"]`), m = sc.getBoundingClientRect(), over = tc.getBoundingClientRect().bottom - m.bottom;
      if (card && over > 0) sc.scrollTop += Math.max(0, Math.min(over, card.getBoundingClientRect().top - m.top - 8)); }
    toast(old ? "Split updated." : "Split saved."); return;
  }
});

function addNames(names){
  let added = 0;
  names.map(n => String(n).trim()).filter(Boolean).forEach(n => { const old = S.people.find(p => p.name.toLowerCase() === n.toLowerCase());
    if (!old){ S.people.push({id:uid(), name:n}); added++; } else if (old.archived){ old.archived = false; added++; } });
  save(); render(true); toast(added ? `Added ${added} ${added === 1 ? "person" : "people"}.` : "Everyone there is already on your list.");
}
$("stmt").addEventListener("change", e => { const file = e.target.files[0]; e.target.value = ""; if (file) openStatement(file); });
// Some banks lock the PDF with a password. KeepWise asks for it, uses it once on this phone to open the file, and keeps
// neither the password nor the file.
async function openStatement(file, password){
  toast("Reading your statement…");
  try { STMT.result = await readStatementFile(file, password); UI.pdfLock = null; const rc = STMT.result.cur;
    STMT.fx = rc && rc !== S.cur && !(CUR_FAMILY[rc] && CUR_FAMILY[rc] === CUR_FAMILY[S.cur]) ? {from: rc, mode: "convert", rate: ""} : null; UI.inbox = false; $("toast").hidden = true; render(false); }
  catch(err){
    if (err && err.locked){ UI.pdfLock = {file, wrong: !!err.wrong}; UI.inbox = false; UI.account = false; $("toast").hidden = true; render(false); const i = view.querySelector("[data-form=pdfLock] input"); if (i) i.focus(); return; }
    toast(err && err.message ? err.message : "Couldn't read that file."); }
}
V.pdfLock = () => `<div class="inline" style="justify-content:space-between"><h1>Locked statement</h1><button class="btn small" type="button" data-pdf-cancel>Cancel</button></div>
  <section class="card"><p><b>${esc(UI.pdfLock.file.name || "This statement")}</b> is protected with a password.</p>
    <p class="muted small">Banks often use part of your account number, your ID number or your date of birth. The email that came with the statement usually says which.</p>
    <form data-form="pdfLock" style="display:flex;flex-direction:column;gap:12px"><label class="field"><span>Statement password</span><input name="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></label>
      ${UI.pdfLock.wrong ? `<p class="err" role="alert" data-pdf-wrong>That password did not open the file. Check it and try again.</p>` : ""}
      <button class="btn primary" type="submit">Unlock and read</button></form>
    <p class="muted small">The password is used once, on this phone, to open the file. KeepWise does not save it or send it anywhere.</p></section>`;
$("restore-in").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try { UI.restore = readBackup(await file.text()); UI.history = false; UI.stmt = null; UI.account = false; UI.inbox = false; S.tab = "plan"; render(false);
    const box = view.querySelector('[data-out="backupBox"]'); if (box) box.scrollIntoView({block: "center"}); }
  catch(err){ toast(err.message || "Couldn’t read that file."); }
});
$("vcf").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { const list = parseVcf(rd.result); e.target.value = "";
    if (!list.length){ toast("No contacts found in that file."); return; }
    const n = mergeContacts(list, "file"); UI.contactsHelp = false; save(); refreshAfterContacts();
    toast(n ? `${n} contact${n === 1 ? "" : "s"} ready to search when you add people to a split.` : "Those contacts are already here."); };
  rd.readAsText(file);
});

// A first visit gets the short setup instead of someone else's numbers. People who already use KeepWise never see it.
let firstRun = false; try { if (localStorage.getItem(KEY)) welcomeDone(); else firstRun = !localStorage.getItem(WELCOME_KEY) && !window.KEEPWISE_NO_SETUP; } catch(e){}  // tests can skip the setup
if (firstRun) UI.welcome = 0;
try { if (S.env) envFix(); } catch(e){}   // older plans could hold shares that did not total 100
// Pay and income set up before KeepWise recorded when: count them as added today, so nothing earlier is asked about.
try { if (S.pay && S.pay.when && !S.pay.since) S.pay.since = isoDaysAgo(0); (S.extras || []).forEach(x => { if (!x.added) x.added = isoDaysAgo(0); }); } catch(e){}
// One-offs logged before they carried their month: a recent one belongs to the month the plan is showing now.
try { const pk = planPeriodNow().key, recent = isoDaysAgo(3); (S.spends || []).forEach(x => { if (!x.k) x.k = (x.date || "") >= recent ? pk : periodKeyOfIso(x.date); }); } catch(e){}
if (S.tab === "subs") remindSeen();  // opening straight onto Subs counts as checking them
save();
applyTheme();
lockLoad();
render(false);
if (LOCK.cfg && !window.KEEPWISE_NO_LOCK) lockNow();
bioAvailable().then(ok => { LOCK.bioOk = ok; if (S && S.tab === "plan" && !LOCK.on) refreshOuts(); });
initShared();
})();
</script>
