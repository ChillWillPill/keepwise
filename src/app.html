    (S.groups = S.groups || []).push({id: uid(), name, ids: Object.keys(splitDraft.parts).filter(id => id !== CTX().me)}); delete UI.groupName; save(); render(true); toast(`Saved ${name}. Add them all in one tap next time.`); return; }
  if (b.hasAttribute("data-group-del")){ const id = b.closest("[data-grp]").dataset.grp, u = undoable(); const g = S.groups.find(x => x.id === id); S.groups = S.groups.filter(x => x.id !== id); save(); render(true); toast(`Removed ${g ? g.name : "group"}.`, u); return; }
  if (b.dataset.partRemove){ delete splitDraft.parts[b.dataset.partRemove]; splitErr = ""; render(true); return; }
  if (b.hasAttribute("data-part-new")){ const n = String(UI.partQ || "").trim(); if (!n) return; const old = S.people.find(p => p.name.toLowerCase() === n.toLowerCase());
    const person = old || {id: uid(), name: n}; if (old) old.archived = false; else S.people.push(person); save(); toast(`Added ${n}.`); addPart(person.id); return; }
  if (b.hasAttribute("data-moments")){ UI.moments = true; render(false); return; }
  if (b.hasAttribute("data-moments-close")){ UI.moments = false; render(false); return; }
  if (b.dataset.space){ UI.biz = b.dataset.space === "business"; render(false); return; }
  if (b.hasAttribute("data-receipt-plus")){ UI.receiptInfo = true; render(true); return; }
  if (b.hasAttribute("data-receipt-close")){ UI.receiptInfo = false; render(true); return; }
  if (b.dataset.info){ UI.info = UI.info === b.dataset.info ? null : b.dataset.info; render(true); return; }
  if (b.hasAttribute("data-remind-on")){ await remindTurnOn(); return; }
  if (b.hasAttribute("data-remind-off")){ S.remind = {on: false, hide: true}; save(); render(true); toast("Reminders are off."); return; }
  if (b.hasAttribute("data-remind-hide")){ S.remind = {on: false, hide: true}; save(); render(true); return; }
  if (b.hasAttribute("data-tell-close")){ UI.tell = null; render(true); return; }
  if (b.hasAttribute("data-tell-each")){ if (UI.tell) UI.tell.each = true; render(true); return; }
  if (b.hasAttribute("data-tell-all") && UI.tell){ const t = UI.tell; if (await tellSend(t.group) && UI.tell === t){ t.groupSent = true; render(true); } return; }
  if (b.hasAttribute("data-tell-send") && UI.tell){ const t = UI.tell, r = t.rows.find(y => y.id === b.closest("[data-tell-id]").dataset.tellId); if (!r) return;
    if (await tellSend(r.text, firstWord(r.name)) && UI.tell === t){ r.sent = true; render(true); } return; }
  if (b.hasAttribute("data-open-account")){ UI.account = true; UI.inbox = false; if (typeof accInit === "function") accInit(); render(false); return; }
  const sp = b.closest("[data-split]");
  if (sp && b.hasAttribute("data-del-split")){
    if (shared()){ const x = SH.splits.find(y => y.id === sp.dataset.split); if (!x) return;
      await shWrite(() => SH.db.doc("splits/" + x.id).update({deleted:true, updatedBy:SH.me, updatedAt:Date.now()}), `Deleted ${x.title}. Your circle was notified.`); return; }
    const x = S.splits.find(y => y.id === sp.dataset.split), u = undoable();
    S.splits = S.splits.filter(y => y !== x); tellAbout("delete", x); save(); render(true); toast(`Deleted ${x ? x.title : "split"}.`, () => { UI.tell = null; u(); }); return; }
  const st = b.closest("[data-settle]");
  if (st && b.hasAttribute("data-settle-btn")){ const pid = st.dataset.settle, amt = +st.dataset.amt, bal = myBalances().find(x => x.p.id === pid);
    if (!bal) return;
    if (shared()){ const me = SH.me, rec = bal.net > 0 ? {from:pid, to:me} : {from:me, to:pid};
      await shWrite(() => SH.db.collection("payments").doc(uid() + uid()).set({...rec, amount:amt, date:isoDaysAgo(0), createdBy:me, createdAt:Date.now()}), bal.net > 0 ? `Recorded ${fmt(amt)} from ${bal.p.name}. Undo it in History.` : `Recorded ${fmt(amt)} paid to ${bal.p.name}. ${bal.p.name} was notified.`); return; }
    if (bal.net > 0) S.settlements.push({id:uid(), from:pid, to:"me", amount:amt, date:isoDaysAgo(0)});
    else S.settlements.push({id:uid(), from:"me", to:pid, amount:amt, date:isoDaysAgo(0)});
    tellSettled(pid, amt, bal.net > 0); save(); render(true); toast(bal.net > 0 ? `Recorded ${fmt(amt)} from ${bal.p.name}. Undo it in History.` : `Recorded ${fmt(amt)} paid to ${bal.p.name}. Undo it in History.`); return; }
  const pay = b.closest("[data-pay]");
  if (pay && shared()){ const x = SH.pays.find(y => y.id === pay.dataset.pay); if (!x) return;
    if (b.hasAttribute("data-pay-edit")){ UI.editPay = x.id; render(true); return; }
    if (b.hasAttribute("data-pay-cancel")){ UI.editPay = null; render(true); return; }
    if (b.hasAttribute("data-pay-del")){ UI.editPay = null; if (await shWrite(() => SH.db.doc("payments/" + x.id).update({deleted:true, updatedBy:SH.me, updatedAt:Date.now()}))) toast(backInList(x)); render(true); return; }
    if (b.hasAttribute("data-pay-save")){ const a = numv(pay.querySelector("[data-pay-amt]").value), dt = pay.querySelector("[data-pay-date]").value;
      if (a <= 0){ toast("Enter an amount above zero, or delete the payment."); return; }
      UI.editPay = null; await shWrite(() => SH.db.doc("payments/" + x.id).update({amount:a, date: dt || x.date, updatedBy:SH.me, updatedAt:Date.now()}), "Payment updated."); render(true); return; }
    return;
  }
  if (pay){ const x = S.settlements.find(y => y.id === pay.dataset.pay); if (!x) return;
    if (b.hasAttribute("data-pay-edit")){ UI.editPay = x.id; render(true); return; }
    if (b.hasAttribute("data-pay-cancel")){ UI.editPay = null; render(true); return; }
    if (b.hasAttribute("data-pay-del")){ S.settlements = S.settlements.filter(y => y !== x); UI.editPay = null; save(); render(true); toast(backInList(x)); return; }
    if (b.hasAttribute("data-pay-save")){ const a = numv(pay.querySelector("[data-pay-amt]").value), dt = pay.querySelector("[data-pay-date]").value;
      if (a <= 0){ toast("Enter an amount above zero, or delete the payment."); return; }
      x.amount = a; if (dt) x.date = dt; UI.editPay = null; save(); render(true); toast("Payment updated."); return; }
  }
  if (sp && b.hasAttribute("data-edit-split")){ const x = CTX().splits.find(y => y.id === sp.dataset.split); if (!x) return;
    const parts = {}; for (const id in x.parts) parts[id] = x.method === "equal" ? 1 : String(x.parts[id]);
    splitDraft = {editId:x.id, title:x.title, amount:String(x.amount), paidBy:x.paidBy, tag:x.tag, method:x.method, parts: x.method === "borrow" ? {} : parts, borrower: x.method === "borrow" ? Object.keys(x.parts)[0] : "", icon: x.icon || ""};
    splitErr = ""; UI.partQ = ""; UI.partOpen = false; render(true);  // edit right where the card was
    const f = document.querySelector('form[data-form="split"]'); if (f) f.scrollIntoView({block: "nearest", behavior: "smooth"}); return; }
  if (b.hasAttribute("data-add-person-open")){ UI.addPerson = true; render(true); const i = $("new-person"); if (i) i.focus(); return; }
  if (b.hasAttribute("data-add-person-cancel")){ UI.addPerson = false; render(true); return; }
  if (b.hasAttribute("data-person-open")){ const id = b.closest("[data-person]").dataset.person; UI.editPerson = UI.editPerson === id ? null : id; render(true); return; }
  if (b.hasAttribute("data-person-done")){ UI.editPerson = null; render(true); return; }
  const pr = b.closest("[data-person]");
  if (pr && b.hasAttribute("data-del-person")){ const id = pr.dataset.person;
    const p = S.people.find(x => x.id === id); if (!p) return;
    const bal = myBalances({kind:"local", me:"me", splits:S.splits, pays:S.settlements, people:S.people}).find(x => x.p.id === id);
    if (bal){ toast(bal.net > 0 ? `${p.name} still owes you ${fmt(bal.net)}. Settle up first.` : `You still owe ${p.name} ${fmt(-bal.net)}. Settle up first.`); return; }
    const inHistory = S.splits.some(x => x.paidBy === id || (x.parts && id in x.parts)) || S.settlements.some(x => x.from === id || x.to === id);
    if (inHistory) p.archived = true; else S.people = S.people.filter(x => x.id !== id);  // settled people leave the list; past splits keep their name
    save(); render(true); toast(inHistory ? `Removed ${p.name}. Past splits still show their name.` : `Removed ${p.name}.`); return; }
  if (b.hasAttribute("data-import")){
    if (navigator.contacts && navigator.contacts.select){
      try { const got = await navigator.contacts.select(["name"], {multiple:true}); addNames(got.map(c => (c.name||[])[0]).filter(Boolean)); return; } catch(err){ /* fall back to file */ }
    }
    $("vcf").click(); return;
  }
});

view.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, fd = new FormData(f);
  if (kind === "pay"){
    const when = fd.get("when") || "monthly", amount = numv(fd.get("amount"));
    if (!amount){ toast("Enter what each paycheck is, after tax."); f.querySelector("[name=amount]").focus(); return; }
    S.pay = {when, amount, day: fd.get("day") ? +fd.get("day") : undefined, day2: when === "twice" ? +fd.get("day2") || 15 : undefined, wd: when === "weekly" ? +fd.get("wd") : undefined, next: when === "biweekly" ? String(fd.get("next") || isoDaysAgo(0)) : undefined};
    S.income = r2(amount * PAY_BASE[when]); S.monthStart = Math.min(28, Math.max(1, +fd.get("monthStart") || 1));
    UI.payEdit = false; save(); if (isField(document.activeElement)) document.activeElement.blur(); render(true); toast(`Saved. Your plan counts ${fmt(S.income)} a month from pay.`); return; }
  if (kind === "income"){
    const name = String(fd.get("name") || "").trim(), amount = numv(fd.get("amount")), when = fd.get("when") || "any";
    if (!name){ toast("Say where the money comes from."); f.querySelector("[name=name]").focus(); return; }
    if (!amount){ toast("Enter an amount above zero."); f.querySelector("[name=amount]").focus(); return; }
    const rec = {name, kind: fd.get("kind") || "other", when, amount, day: when === "monthly" ? +fd.get("day") || 1 : undefined, wd: when === "weekly" ? +fd.get("wd") : undefined, next: when === "biweekly" ? String(fd.get("next") || isoDaysAgo(0)) : undefined};
    const old = UI.incEdit && extras().find(x => x.id === UI.incEdit);
    if (old) Object.assign(old, rec); else extras().push({id: uid(), got: [], ...rec});
    UI.incAdd = false; UI.incEdit = null; save(); if (isField(document.activeElement)) document.activeElement.blur(); refreshOuts(); toast(old ? `${name} updated.` : `Added ${name}. Your plan now counts it.`); return; }
  if (kind === "incomeLog"){ const x = extras().find(v => v.id === f.closest("[data-inc]").dataset.inc), a = numv(fd.get("amount")); if (!x) return;
    if (!a){ toast("Enter the amount you received."); return; }
    (x.got = x.got || []).push({id: uid(), date: String(fd.get("date") || isoDaysAgo(0)), amount: a}); UI.incLog = null; save(); if (isField(document.activeElement)) document.activeElement.blur(); refreshOuts(); toast(`Logged ${fmt(a)} from ${x.name}.`); return; }
  if (kind === "closeMonth"){ const key = f.closest("[data-close]").dataset.close; closeMonth(key, numv(fd.get("amount"))); return; }
  if (kind === "ask"){ const q = $("ask-in").value.trim(); if (!q) return; ASK.last = answer(q); const o = $("ask-out"); o.hidden = false; o.textContent = ASK.last; $("ask-in").blur(); return; }
  if (kind === "addSub"){ const name = String(fd.get("name")).trim(), price = numv(fd.get("price")); if (!name || !price){ toast("Add a name and a price."); return; }
    const ns = {id:uid(), name, price, cycle:fd.get("cycle"), last:fd.get("last") || isoDaysAgo(0), group:String(fd.get("group")||"").trim(), env:"misc", keep:"auto"};
    const rn = String(fd.get("renew") || ""); if (rn){ if (ns.cycle === "yr") ns.renewDate = rn; else ns.renewDay = +rn.slice(8, 10); }
    S.subs.push(ns); save(); render(true); toast(`Added ${name}.`); return; }
  if (kind === "addSwap"){ const link = fd.get("link"), alt = String(fd.get("alt")).trim(); if (!link || !alt){ toast("Pick what you pay for and name the cheaper option."); return; }
    const [type,id] = link.split(":"), src = type === "expense" ? S.expenses.find(x=>x.id===id) : S.subs.find(x=>x.id===id);
    S.swaps.push({id:uid(), link, title: src ? src.name : "", alt, altCost:numv(fd.get("altCost")), note:"", on:false}); save(); render(true); toast("Comparison added."); return; }
  if (kind === "addCode"){ const store = String(fd.get("store")).trim(), code = String(fd.get("code")).trim(); if (!store || !code) return;
    S.codes.unshift({id:uid(), store, code, offer:String(fd.get("offer")||"").trim(), worked:0, failed:0, last:isoDaysAgo(0), mine:true}); save(); render(true); toast(`Saved the ${store} code.`); return; }
  if (kind === "addPerson"){ const name = String(fd.get("name")).trim(); if (!name){ toast("Type a name first."); return; } UI.addPerson = false; addNames([name]); return; }
  if (kind === "split"){
    const d = splitDraft, amount = numv(d.amount);
    if (!d.title.trim()){ splitErr = "Say what the split is for."; render(true); return; }
    if (amount <= 0){ splitErr = "Enter a total above zero."; render(true); return; }
    let parts = {};
    if (d.method === "borrow"){ const who = (d.borrower && d.borrower !== d.paidBy ? d.borrower : "") || (CTX().people.find(p => p.id !== d.paidBy && !p.archived) || {}).id; if (!who){ splitErr = "Add another person first."; render(true); return; } parts[who] = amount; }
    else {
      const ids = Object.keys(d.parts); if (ids.length < 2){ splitErr = "Pick at least two people."; render(true); return; }
      if (d.method === "equal") ids.forEach(id => parts[id] = 1);
      else { ids.forEach(id => parts[id] = numv(d.parts[id]));
        const sum = ids.reduce((a,id) => a + parts[id], 0);
        if (d.method === "percent" && Math.abs(sum - 100) > 0.01){ splitErr = `Percentages add up to ${r2(sum)}%. Make them total 100%.`; render(true); return; }
        if (d.method === "exact" && Math.abs(sum - amount) > 0.01){ splitErr = `Amounts add up to ${fmt(sum)}, not ${fmt(amount)}.`; render(true); return; } }
    }
    const rec = {title:d.title.trim(), amount, tag:d.tag, paidBy:d.paidBy, method:d.method, parts, icon: d.icon || ""};
    if (shared()){
      const me = SH.me, old = d.editId && SH.splits.find(y => y.id === d.editId);
      const ok = old ? await shWrite(() => { const {id, ...body} = old; return SH.db.doc("splits/" + old.id).set({...body, ...rec, updatedBy:me, updatedAt:Date.now()}); }, "Split updated. Your circle was notified.")
                     : await shWrite(() => SH.db.collection("splits").doc(uid() + uid()).set({...rec, date:isoDaysAgo(0), createdBy:me, createdAt:Date.now()}), "Split saved. Everyone in it was notified.");
      if (ok){ const wasEdit = d.editId; splitDraft = null; splitErr = ""; render(!!wasEdit); showSplitCard(wasEdit); }
      return;
    }
    const old = d.editId && S.splits.find(y => y.id === d.editId);
    const before = old ? JSON.parse(JSON.stringify(old)) : null, made = old || {id:uid(), ...rec, date:isoDaysAgo(0)};
    if (old) Object.assign(old, rec); else S.splits.push(made);
    tellAbout(old ? "edit" : "add", made, before);
    splitDraft = null; splitErr = ""; save(); render(!!old); if (old) showSplitCard(old.id);
    const tc = document.querySelector("[data-tell]"), sc = $("main");
    if (tc && !old) tc.scrollIntoView({block: "nearest"});
    else if (tc && sc){  // show as much of the prompt as fits without pushing the edited split off the top
      const card = document.querySelector(`[data-split="${old.id}"]`), m = sc.getBoundingClientRect(), over = tc.getBoundingClientRect().bottom - m.bottom;
      if (card && over > 0) sc.scrollTop += Math.max(0, Math.min(over, card.getBoundingClientRect().top - m.top - 8)); }
    toast(old ? "Split updated." : "Split saved."); return;
  }
});

function addNames(names){
  let added = 0;
  names.map(n => String(n).trim()).filter(Boolean).forEach(n => { const old = S.people.find(p => p.name.toLowerCase() === n.toLowerCase());
    if (!old){ S.people.push({id:uid(), name:n}); added++; } else if (old.archived){ old.archived = false; added++; } });
  save(); render(true); toast(added ? `Added ${added} ${added === 1 ? "person" : "people"}.` : "Everyone there is already on your list.");
}
$("stmt").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  toast("Reading your statement…");
  try { STMT.result = await readStatementFile(file); const rc = STMT.result.cur;
    STMT.fx = rc && rc !== S.cur && !(CUR_FAMILY[rc] && CUR_FAMILY[rc] === CUR_FAMILY[S.cur]) ? {from: rc, mode: "convert", rate: ""} : null; UI.inbox = false; $("toast").hidden = true; render(false); }
  catch(err){ toast(err && err.message ? err.message : "Couldn't read that file."); }
});
$("restore-in").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try { UI.restore = readBackup(await file.text()); UI.history = false; UI.stmt = null; UI.account = false; UI.inbox = false; S.tab = "plan"; render(false);
    const box = view.querySelector('[data-out="backupBox"]'); if (box) box.scrollIntoView({block: "center"}); }
  catch(err){ toast(err.message || "Couldn’t read that file."); }
});
$("vcf").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { const list = parseVcf(rd.result); e.target.value = "";
    if (!list.length){ toast("No contacts found in that file."); return; }
    const n = mergeContacts(list, "file"); UI.contactsHelp = false; save(); refreshAfterContacts();
    toast(n ? `${n} contact${n === 1 ? "" : "s"} ready to search when you add people to a split.` : "Those contacts are already here."); };
  rd.readAsText(file);
});

// A first visit gets the short setup instead of someone else's numbers. People who already use KeepWise never see it.
let firstRun = false; try { if (localStorage.getItem(KEY)) welcomeDone(); else firstRun = !localStorage.getItem(WELCOME_KEY) && !window.KEEPWISE_NO_SETUP; } catch(e){}  // tests can skip the setup
if (firstRun) UI.welcome = 0;
if (S.tab === "subs") remindSeen();  // opening straight onto Subs counts as checking them
save();
applyTheme();
render(false);
initShared();
})();
</script>
