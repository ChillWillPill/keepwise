<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="See what you keep at month end: subscriptions, cheaper swaps, codes, budget and bill splitting.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KeepWise">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>KeepWise</title>
<meta name="theme-color" content="#f3efe6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
<style>
/* Layout: an app shell pinned to the visible screen (sized from visualViewport in JS): header, one scrolling column, tab bar flush to the bottom edge. */
:root{
  --bg:#f3efe6; --card:#fbf8f2; --ink:#1c2420; --muted:#4d564e; --line:#e0d5c5; --chip:#efe4d4;
  --green:#1b6843; --green-soft:#e4f2ea; --rust:#a84b34; --rust-soft:#f6e2da; --gold:#9a7417; --gold-soft:#f3e9cc;
  --av-s:42%; --av-l:86%; --av-fg:28%; --brand-teal:#0e8571; --brand-gold:#a57d2c;
  --lift:0 1px 2px rgba(28,36,32,.04),0 6px 18px -12px rgba(28,36,32,.18);
  --display:"Fraunces", ui-serif, Georgia, serif;
  --body:"Figtree", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141613; --card:#1d201c; --ink:#ece8de; --muted:#a3a095; --line:#343830; --chip:#2a2d27;
  --green:#79c79b; --green-soft:#1f3326; --rust:#e79075; --rust-soft:#3a2219; --gold:#e0bb5e; --gold-soft:#332a12; --lift:0 1px 0 rgba(255,255,255,.03),0 8px 22px -14px rgba(0,0,0,.6); --av-s:28%; --av-l:26%; --av-fg:82%; --brand-teal:#3cc2a8; --brand-gold:#e0b75c; color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#141613; --card:#1d201c; --ink:#ece8de; --muted:#a3a095; --line:#343830; --chip:#2a2d27;
  --green:#79c79b; --green-soft:#1f3326; --rust:#e79075; --rust-soft:#3a2219; --gold:#e0bb5e; --gold-soft:#332a12; --lift:0 1px 0 rgba(255,255,255,.03),0 8px 22px -14px rgba(0,0,0,.6); --av-s:28%; --av-l:26%; --av-fg:82%; --brand-teal:#3cc2a8; --brand-gold:#e0b75c; color-scheme:dark}

*{box-sizing:border-box}
.brand b,h1,h2,.big,.summary3 b,.bigsoft{font-optical-sizing:auto;font-weight:600;letter-spacing:-.025em}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
.app{position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-h,100%);display:flex;flex-direction:column;background:var(--bg)}
.app-header{flex:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;display:block;flex:none;box-shadow:0 0 0 1px var(--line)}
.brand b{font:600 1.25rem/1.1 var(--display);letter-spacing:-.025em;display:block}
.wordmark{color:var(--brand-teal)} .wordmark span{color:var(--brand-gold)}
.brand small{color:var(--muted);font-size:.75rem}
.bell{appearance:none;position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.bell[hidden]{display:none}
.bell:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.bell-n{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:99px;background:var(--rust);color:var(--card);font:700 .72rem/20px var(--body);text-align:center;padding:0 5px}
.app-main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{max-width:720px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:18px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.app.typing .tabbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 clamp(.6rem,2.9vw,.78rem)/1.2 var(--body);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 8px;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
.tab span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.tab .ti{display:grid;place-items:center;width:52px;max-width:92%;height:30px;border-radius:99px;transition:background .2s ease,color .2s ease}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] .ti{background:var(--green-soft);color:var(--green)}
.tab:focus-visible{outline:2px solid var(--green);outline-offset:-4px;border-radius:8px}

h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 clamp(1.9rem,9.4vw,2.25rem)/1.1 var(--display);letter-spacing:-.025em}
.view > h1:first-child,.view > .inline:first-child h1{text-align:center}
.hero{background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 22%,transparent);border-radius:24px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:clamp(2.4rem,12.4vw,3rem)}
.hero p{max-width:40ch;margin-inline:auto}
h2{font:600 1.5rem/1.2 var(--display);letter-spacing:-.025em}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.legal-links{margin:0;color:var(--muted)} .legal-links a{color:var(--muted)}
.label{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.big{font:600 3rem/1 var(--display);color:var(--green);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.big.neg{color:var(--rust)}
.good{color:var(--green)} .bad{color:var(--rust)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--lift)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--lift)}
.row{padding:14px 18px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.row-top > div:last-child{text-align:right;flex:none}
.name{font-weight:600}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;min-width:0}
/* iPhone Safari draws date boxes natively and ignores width; make them behave like the other fields */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:48px;line-height:1.5;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0;opacity:.6}
.grid2 > *{min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
/* currency label and number share one box, so any length of symbol fits ($, £, PKR, AED) */
.money-in{display:flex;align-items:center;gap:8px;min-width:0;min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.money-in em{font-style:normal;color:var(--muted);flex:none;white-space:nowrap}
.money-in input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;border-radius:0}
.money-in input:focus{outline:none}
.money-in:focus-within{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{appearance:none;font:600 .95rem var(--body);border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;cursor:pointer;text-align:center;transition:transform .12s ease,background .2s ease;-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,.seg button:active{transform:scale(.97)}
.btn.primary{box-shadow:0 6px 16px -8px color-mix(in srgb,var(--green) 70%,transparent)}
@media (prefers-reduced-motion:no-preference){.view.enter{animation:viewin .22s ease-out both}@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
.icon-btn{appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.hdr-actions{display:flex;gap:8px;align-items:center}
.home-link{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;border-radius:12px;-webkit-tap-highlight-color:transparent}
.home-link:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.btn:focus-visible,.link:focus-visible,.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn.primary{background:var(--green);border-color:var(--green);color:#f3faf6;width:100%;padding:14px;font-size:1rem;border-radius:16px}
a.btn{display:block;text-decoration:none}
.btn.small{padding:6px 10px;font-size:.84rem;border-radius:10px}
.btn.danger{color:var(--rust)}
.link{appearance:none;background:none;border:0;padding:0;font:600 1rem var(--body);color:var(--green);cursor:pointer;text-align:left}
.link.plain{color:var(--ink);font-weight:500}
.linkrow{border-top:1px solid var(--line);padding-top:12px}

.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--chip)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:-1px}
.meter{height:9px;border-radius:99px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--green)}
.meter i.over{background:var(--rust)}

.pill{display:inline-block;font-size:.76rem;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill.flag{background:var(--rust-soft);color:var(--rust)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.grey{background:var(--chip);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{appearance:none;border:0;background:none;font:600 .85rem var(--body);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--green-soft);color:var(--green)}
.seg button[aria-pressed="true"].drop{background:var(--rust-soft);color:var(--rust)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:0;background:var(--chip);color:var(--ink);font:500 .95rem var(--body);padding:9px 16px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.summary3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.summary3 b{display:block;font:600 1.5rem/1.2 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.balances{border-top:1px solid var(--line)}
.balances div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.entry{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:start}
.ico{width:48px;height:48px;border-radius:14px;background:var(--chip);display:grid;place-items:center;color:var(--ink)}
.ico svg{width:24px;height:24px}
.code{font:600 .95rem ui-monospace,"SFMono-Regular",Menlo,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--ink)}
.ask-out{background:var(--bg);border-radius:14px;padding:12px 14px;white-space:pre-line}
.note{background:var(--chip);color:var(--ink);border-radius:16px;padding:14px 16px;font-size:.95rem}
.err{color:var(--rust);font-size:.9rem;font-weight:600}
.empty{color:var(--muted);padding:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:.92rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
details summary{cursor:pointer;font-weight:600;color:var(--green);list-style:none}
details summary::-webkit-details-marker{display:none}
.cmp-wrap{display:flex;flex-direction:column;gap:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:200px;border-bottom:1px solid var(--line)}
.cmp-col{appearance:none;border:0;background:transparent;border-radius:14px 14px 0 0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding:0;cursor:pointer;position:relative;font:inherit;color:var(--ink)}
.cmp-col:hover,.cmp-col.on,.cmp-col:focus-visible{background:var(--chip);outline:none}
.cmp-val{font-weight:600;font-size:.95rem;color:var(--muted)}
.cmp-bar{display:block;width:44%;max-width:72px;border-radius:4px 4px 0 0;background:var(--green)}
.cmp-bar.now{background:color-mix(in srgb,var(--green) 55%,var(--card))}
.cmp-tip{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:none;flex-direction:column;align-items:flex-start;gap:2px;white-space:nowrap;z-index:2;text-align:left;font-size:.95rem;pointer-events:none}
.cmp-tip small{opacity:.8}
.cmp-col:hover .cmp-tip,.cmp-col.on .cmp-tip,.cmp-col:focus-visible .cmp-tip{display:flex}
.cmp-labels{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.cmp-bar{animation:grow .4s ease-out both;transform-origin:bottom}@keyframes grow{from{transform:scaleY(.2)}to{transform:scaleY(1)}}}
.env-row{padding:0}
.env-head{appearance:none;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit;padding:14px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.env-head:focus-visible{outline:2px solid var(--green);outline-offset:-3px;border-radius:14px}
.env-hint{display:inline-flex;align-items:center;gap:4px;align-self:flex-end}
.env-row.open .env-hint svg{transform:rotate(180deg)}
.env-body{padding:0 18px 16px;display:flex;flex-direction:column;gap:0}
.env-body > .btn.primary{margin-bottom:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.line .inline{flex-wrap:nowrap}
.danger-link{color:var(--rust)}
.add-line{margin-top:12px;flex-wrap:nowrap}
.review{border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.review-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.review-btns .btn{padding:10px 6px;white-space:nowrap;font-size:.92rem}
.import-card h3{font-size:1.05rem}
.people .person,.people .person-wrap{border-bottom:1px solid var(--line)}
.people > :last-child,.people .person-wrap .person{border-bottom:0}
.person{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;background:none;border:0;font:inherit;color:inherit;text-align:left;-webkit-tap-highlight-color:transparent}
button.person{cursor:pointer}
button.person:hover{background:color-mix(in srgb,var(--chip) 45%,transparent)}
button.person:focus-visible{outline:2px solid var(--green);outline-offset:-3px}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.95rem;letter-spacing:.02em;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 45% var(--av-fg))}
.pname{display:flex;flex-direction:column;min-width:0;flex:1}
.pname .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);transition:transform .2s ease;display:grid}
.person-wrap.open .chev{transform:rotate(90deg)}
.person-edit{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.acct-btn{overflow:hidden;padding:0}
.acct-btn img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:100%;height:100%;font-size:.85rem}
.avatar.lg{width:88px;height:88px;font-size:1.6rem}
.acc-head{align-items:center;text-align:center}
.acc-photo img{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block}
.acc-id{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;max-width:100%}
.acc-id b{font:600 1.35rem/1.2 var(--display);letter-spacing:-.015em;overflow-wrap:anywhere}
.acc-id .muted{overflow-wrap:anywhere}
.acc-photo-btns{justify-content:center}
.acc-form{display:flex;flex-direction:column;gap:14px}
.acc-seg{align-self:stretch;display:grid;grid-template-columns:1fr 1fr}
.acc-seg button{padding:10px 12px;font-size:.92rem}
.g-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:13px 14px;font-size:1rem;border-radius:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.93rem;line-height:1.45;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--green)}
.acc-legal{text-align:center}
.space-switch{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.space-switch button{appearance:none;border:0;background:none;font:600 .95rem var(--body);color:var(--muted);padding:11px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.space-switch button+button{border-left:1px solid var(--line)}
.space-switch button[aria-pressed="true"]{background:var(--green-soft);color:var(--green)}
.biz-wrap{position:relative;display:grid}
.biz-demo{grid-area:1/1;display:flex;flex-direction:column;gap:18px;filter:blur(3px) saturate(.9);opacity:.55;pointer-events:none;user-select:none}
.biz-panel{grid-area:1/1;align-self:start;margin-top:40px;box-shadow:0 20px 50px -24px rgba(0,0,0,.45);border-color:color-mix(in srgb,var(--gold) 40%,var(--line));position:relative;z-index:1}
.biz-panel h2{font-size:1.45rem}
.biz-feats{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.biz-feats li{line-height:1.45}
.biz-list{list-style:none;margin:0;padding:0}
.biz-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.biz-list li:first-child{border-top:0}
.biz-list li div{display:flex;flex-direction:column}
.biz-bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.biz-bar span{display:block;height:100%;background:var(--gold);border-radius:99px}
.receipt-btn{display:flex;align-items:center;justify-content:center;gap:2px;border-style:dashed}
.receipt-btn .pill{margin-left:8px}
.receipt-note p{margin-bottom:10px}
.receipt-note .inline{gap:12px}
.plus-card{border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}

/* ================= viewport: keep the shell pinned to what is actually visible ================= */
const appEl = document.getElementById("app"), vv = window.visualViewport, rootStyle = document.documentElement.style;
function fit(){
  rootStyle.setProperty("--vv-h", (vv ? vv.height : window.innerHeight) + "px");
  rootStyle.setProperty("--vv-top", (vv ? vv.offsetTop : 0) + "px");
}
let fitRaf; const refit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fit); };

["resize","orientationchange","pageshow","load"].forEach(e => window.addEventListener(e, refit));
const isField = el => !!(el && el.matches && el.matches("input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select"));
document.addEventListener("focusin", e => { if (isField(e.target) && e.target.tagName !== "SELECT") appEl.classList.add("typing"); });
// Leaving a field redraws the numbers, but never in the middle of a tap: redrawing between press and release
// would swap out the button being pressed (Add, Save) and the tap would be lost along with what was typed.
let ptrDown = false, blurPending = false;

document.addEventListener("pointerdown", () => { ptrDown = true; }, true);
const ptrEnd = () => setTimeout(() => { ptrDown = false; if (blurPending) { blurPending = false; afterBlur(); } }, 0);
document.addEventListener("pointerup", ptrEnd, true);
document.addEventListener("pointercancel", ptrEnd, true);
document.addEventListener("focusout", () => setTimeout(() => { if (ptrDown) blurPending = true; else afterBlur(); }, 60));

const subMonthly = s => s.cycle === "yr" ? s.price / 12 : s.price;
function subFlags(){
  const out = {};

    const reasons = [], d = s.last ? daysSince(s.last) : null;
    if (s.low) reasons.push("You said you barely use it");
    if (d !== null && d > S.ruleDays) reasons.push(`Unused for ${d} days`);
    if (s.group && d !== null){
      const newer = S.subs.find(o => o !== s && o.last && o.group && o.group.toLowerCase() === s.group.toLowerCase() && o.keep !== "drop" && daysSince(o.last) < d);
      if (newer) reasons.push(`Duplicate of ${newer.name}`);

}
function swapFor(type, id){ return S.swaps.find(w => w.on && w.link === `${type}:${id}`); }
function compute(){
  const flags = subFlags();
  let needs = 0, misc = 0;
  S.expenses.forEach(e => { const w = swapFor("expense", e.id), a = w ? +w.altCost : +e.amount || 0; if (e.env === "needs") needs += a; else misc += a; });
  const liveSubs = S.subs.filter(s => s.keep !== "drop");
  liveSubs.forEach(s => { const w = swapFor("sub", s.id), a = w ? +w.altCost : subMonthly(s); if (s.env === "needs") needs += a; else misc += a; });
  const income = +S.income || 0;
  const savings = income - needs - misc;
  const flagged = liveSubs.filter(s => flags[s.id].length && s.keep !== "keep");
  const flaggedSave = flagged.reduce((a, s) => { const w = swapFor("sub", s.id); return a + (w ? +w.altCost : subMonthly(s)); }, 0);
  const envNeeds = income * S.env.needs / 100, envMisc = income * S.env.misc / 100, envSave = income * S.env.save / 100;
  const efTarget = S.efMonths * needs;
  const efGap = Math.max(0, efTarget - S.efSaved);
  let toEF = 0, toGoal = 0;
  const pos = Math.max(0, savings);
  if (S.priority === "ef"){ toEF = Math.min(pos, efGap); toGoal = pos - toEF; }
  else if (S.priority === "goal"){ toGoal = Math.min(pos, S.goalAmt || pos); toEF = pos - toGoal; }
  else { toEF = Math.min(pos / 2, efGap); toGoal = pos - toEF; }
  const efMonthsLeft = toEF > 0 ? Math.ceil(efGap / toEF) : null;
  const inactiveSwaps = S.swaps.map(w => ({w, save: swapSaving(w)})).filter(x => !x.w.on && x.save > 0).sort((a,b) => b.save - a.save);
  const now = new Date(), dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate(), left = dim - now.getDate();
  const nextMonth = left <= 2;
  const planDate = nextMonth ? new Date(now.getFullYear(), now.getMonth()+1, 1) : now;
  const mName = d => d.toLocaleString("en-US", {month:"long"});
  const planNote = nextMonth ? (left === 0 ? `Today is the last day of ${mName(now)}, so this plan covers ${mName(planDate)}.` : left === 1 ? `${mName(now)} ends tomorrow, so this plan covers ${mName(planDate)}.` : `${left} days left in ${mName(now)}. This plan covers ${mName(planDate)}.`) : `${left} days left in ${mName(now)}. This plan covers ${mName(now)}.`;
  const planKey = `${planDate.getFullYear()}-${String(planDate.getMonth()+1).padStart(2,"0")}`;
  const setAside = (S.deposits || []).filter(x => x.month === planKey).reduce((a,x) => a + x.amount, 0);
  const endSaved = S.efSaved + savings - setAside;
  const toSetAside = Math.max(0, r2(savings - setAside));
  return {flags, needs, misc, income, savings, flagged, flaggedSave, envNeeds, envMisc, envSave, efTarget, efGap, toEF, toGoal, efMonthsLeft, inactiveSwaps, planMonth: mName(planDate), planNote, liveSubs, planKey, setAside, endSaved, toSetAside};
}

  const kept = words.filter((w, i) => !STOP_WORDS.has(w) || (i === 0 && KEEP_FIRST.test(w) && words.length === 1));
  return (kept.slice(0, 2).join(" ") || words.slice(0, 2).join(" ") || desc.toUpperCase()).trim();
}
const titleCase = k => k.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/\bIcloud\b/, "iCloud").replace(/\bAt&t\b/i, "AT&T");

// ---- dates and amounts ----
const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function parseAnyDate(s, yearHint, dayFirst){
  s = String(s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    const df = dayFirst || a > 12; return new Date(y, (df ? b : a) - 1, df ? a : b);
  }
  if ((m = s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3,4})[a-z]*[\s-,]*(\d{2,4})?/)) && MONTHS[m[2].toLowerCase()] !== undefined){
    let y = m[3] ? +m[3] : yearHint; if (y < 100) y += 2000; return new Date(y, MONTHS[m[2].toLowerCase()], +m[1]);
  }
  if ((m = s.match(/^([A-Za-z]{3,4})[a-z]*\.?\s+(\d{1,2}),?\s*(\d{2,4})?/)) && MONTHS[m[1].toLowerCase()] !== undefined){
    let y = m[3] ? +m[3] : yearHint; if (y < 100) y += 2000; return new Date(y, MONTHS[m[1].toLowerCase()], +m[2]);
  }
  const t = Date.parse(s); return isNaN(t) ? null : new Date(t);
}
function parseMoney(s){
  if (s == null) return NaN; s = String(s).trim(); if (!s) return NaN;
  const neg = /^\(.*\)$/.test(s) || /^-|-$/.test(s.replace(/[^\d\-()]/g, "")) || /\bDR\b/i.test(s);
  const v = parseFloat(s.replace(/[^0-9.]/g, "")); if (isNaN(v)) return NaN;
  return neg ? -v : v;
}
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

// ---- CSV ----
function csvRows(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === ";" && !text.slice(0, 200).includes(",")) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); if (row.some(x => x.trim())) rows.push(row); row = []; f = ""; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
function txFromCSV(text){
  const rows = csvRows(text.replace(/^﻿/, ""));
  let hi = rows.findIndex(r => r.some(c => /date/i.test(c)) && r.some(c => /desc|name|merchant|payee|details|narrative|memo|particular|transaction/i.test(c)));
  if (hi < 0) throw new Error("Couldn't find the header row. The file needs columns for date, description and amount.");
  const h = rows[hi].map(x => x.trim().toLowerCase()), find = re => h.findIndex(x => re.test(x));
  const di = find(/date/), de = find(/desc|name|merchant|payee|details|narrative|memo|particular|transaction/);
  const cr = find(/credit|paid in|deposit|money in|inflow/), db = find(/debit|paid out|withdraw|money out|outflow/);
  const am = find(/^amount|amount$|value|^sum/), ty = find(/^type$|dr\/cr|cr\/dr|direction/);
  if (di < 0 || de < 0 || (am < 0 && cr < 0 && db < 0)) throw new Error("Couldn't find date, description and amount columns.");
  const year = new Date().getFullYear(), dayFirst = ["GBP","EUR","PKR","INR","AUD","AED"].includes(S.cur);
  let tx = rows.slice(hi + 1).map(r => {
    const date = parseAnyDate(r[di], year, dayFirst), desc = (r[de] || "").trim();
    let amt;
    if (cr >= 0 || db >= 0){ const c = parseMoney(r[cr]), d = parseMoney(r[db]); amt = !isNaN(c) && c !== 0 ? Math.abs(c) : !isNaN(d) && d !== 0 ? -Math.abs(d) : NaN; }
    else { amt = parseMoney(r[am]); if (ty >= 0 && !isNaN(amt)){ const t = (r[ty] || "").toLowerCase(); if (/^d|debit|out|withdraw/.test(t)) amt = -Math.abs(amt); else if (/^c|credit|in|deposit/.test(t)) amt = Math.abs(amt); } }
    return {date, desc, amt};
  }).filter(t => t.date && !isNaN(t.date) && t.desc && !isNaN(t.amt) && t.amt !== 0);
  if (!tx.length) throw new Error("No transactions found in that file.");
  if (am >= 0 && cr < 0 && db < 0 && ty < 0 && tx.every(t => t.amt > 0)){
    // one unsigned column: payroll-looking lines are money in, everything else is money out
    tx.forEach(t => { if (catOfDesc(t.desc) !== "Salary") t.amt = -t.amt; });
  }
  return tx;
}

// ---- PDF (pdf.js loaded on first use) ----
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Couldn't load the PDF reader. Check your connection and try again.")); document.head.appendChild(s); }); }
async function pdfLib(){
  if (window.pdfjsLib) return window.pdfjsLib;
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  await loadScript(base + "pdf.min.js");
  await loadScript(base + "pdf.worker.min.js"); // runs on the page itself, no separate worker needed
  return window.pdfjsLib;
}
async function pdfLines(buf){
  const lib = await pdfLib();
  const doc = await lib.getDocument({data: buf, isEvalSupported: false, disableFontFace: true}).promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++){
    const page = await doc.getPage(p), content = await page.getTextContent(), rows = new Map();
    content.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5] / 3) * 3; if (!rows.has(y)) rows.set(y, []); rows.get(y).push({x: it.transform[4], s: it.str}); });
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, items]) => lines.push(items.sort((a, b) => a.x - b.x).map(i => i.s).join(" ").replace(/\s+/g, " ").trim()));
  }
  return lines;
}
const MONEY_RE = /\(?-?[£$€₹]?\s?(?:Rs\.?\s?)?\d{1,3}(?:,\d{3})*\.\d{2}\)?(?:\s?(?:CR|DR))?-?/gi;
const DATE_RE = /^(\d{4}[-/.]\d{1,2}[-/.]\d{1,2}|\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}|\d{1,2}[\s-][A-Za-z]{3,4}[a-z]*(?:[\s-,]+\d{2,4})?|[A-Za-z]{3,4}\.?\s\d{1,2}(?:,?\s\d{4})?)\b/;
function txFromLines(lines){
  const joined = lines.join(" "), yearHint = +((joined.match(/\b(20\d{2})\b/) || [])[1] || new Date().getFullYear());
  const dayFirst = ["GBP","EUR","PKR","INR","AUD","AED"].includes(S.cur);
  const out = []; let prevBal = null;
  for (const line of lines){
    const dm = line.match(DATE_RE); if (!dm) continue;
    const date = parseAnyDate(dm[1], yearHint, dayFirst); if (!date || isNaN(date)) continue;
    const rest = line.slice(dm[0].length), nums = rest.match(MONEY_RE); if (!nums) continue;
    const desc = rest.replace(MONEY_RE, " ").replace(/\s+/g, " ").trim(); if (!desc || /opening|closing|brought forward|carried forward|balance b\/f|balance c\/f/i.test(desc)) { if (nums.length) prevBal = Math.abs(parseMoney(nums[nums.length-1])); continue; }
    let amt = parseMoney(nums.length >= 2 ? nums[nums.length - 2] : nums[0]);
    const bal = nums.length >= 2 ? parseMoney(nums[nums.length - 1]) : null;
    const signed = /-|\(|DR|CR/i.test(nums.length >= 2 ? nums[nums.length - 2] : nums[0]);
    if (nums.length >= 3){ // separate debit and credit columns: whichever is non-zero
      const a = parseMoney(nums[nums.length - 3]), b = parseMoney(nums[nums.length - 2]);
      amt = a && !b ? -Math.abs(a) : Math.abs(b);
    } else if (!signed){
      if (bal != null && prevBal != null && Math.abs(Math.abs(prevBal - bal) - Math.abs(amt)) < 0.02) amt = bal > prevBal ? Math.abs(amt) : -Math.abs(amt);
      else amt = catOfDesc(desc) === "Salary" || /\b(CR|CREDIT|DEPOSIT|REFUND|RECEIVED|FROM)\b/i.test(desc) ? Math.abs(amt) : -Math.abs(amt);
    } else if (/CR/i.test(nums[nums.length >= 2 ? nums.length - 2 : 0])) amt = Math.abs(amt);
    if (bal != null) prevBal = bal;
    if (amt) out.push({date, desc, amt});
  }
  if (!out.length) throw new Error("Couldn't read transactions from that PDF. Scanned statements (photos) can't be read; try the CSV export from your bank's website instead.");
  return out;
}

// ---- analysis ----
function analyzeStatement(tx, fileName){
  tx.sort((a, b) => a.date - b.date);
  const first = tx[0].date, last = tx[tx.length - 1].date;
  const months = Math.max(1, Math.round((last - first) / (30.44 * DAY) + 0.5));
  const group = list => { const g = {}; list.forEach(t => { const k = merchantKey(t.desc); (g[k] = g[k] || []).push(t); }); return g; };
  const cadenceOf = list => {
    if (list.length < 2) return null;
    const gaps = list.slice(1).map((t, i) => (t.date - list[i].date) / DAY), amts = list.map(t => Math.abs(t.amt));
    const steady = Math.max(...amts) / Math.min(...amts) <= 1.25, avgGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    if (steady && gaps.every(g => g >= 25 && g <= 36)) return "monthly";
    if (steady && gaps.every(g => g >= 12 && g <= 16)) return "biweekly";
    if (steady && gaps.every(g => g >= 6 && g <= 8)) return "weekly";
    if (steady && gaps.every(g => g >= 350 && g <= 380)) return "yearly";
    if (avgGap >= 25 && avgGap <= 36 && steady) return "monthly";
    return null;
  };
  const perMonth = (amt, cad) => cad === "weekly" ? amt * 52 / 12 : cad === "biweekly" ? amt * 26 / 12 : cad === "yearly" ? amt / 12 : amt;
  // money in
  const credits = tx.filter(t => t.amt > 0), cg = group(credits), income = [];
  let otherIn = 0;
  for (const [k, list] of Object.entries(cg)){
    const cad = cadenceOf(list), isPay = list.some(t => catOfDesc(t.desc) === "Salary");
    const total = list.reduce((a, t) => a + t.amt, 0);
    if (isPay || (cad && catOfDesc(list[0].desc) !== "Transfers")){
      const avg = total / list.length, days = list.map(t => t.date.getDate());
      const payday = days.sort((a, b) => days.filter(v => v === b).length - days.filter(v => v === a).length)[0];
      income.push({name: titleCase(k), monthly: r2(cad ? perMonth(avg, cad) : total / months), cadence: cad || "irregular", payday, count: list.length});
    } else otherIn += total;
  }
  income.sort((a, b) => b.monthly - a.monthly);
  const monthlyIncome = r2(income.reduce((a, s) => a + s.monthly, 0));
  // money out
  const debits = tx.filter(t => t.amt < 0), dg = group(debits), subs = [], bills = [], taxes = [], spend = {};
  for (const [k, list] of Object.entries(dg)){
    const cat = catOfDesc(list[0].desc), cad = cadenceOf(list), amts = list.map(t => -t.amt), total = amts.reduce((a, b) => a + b, 0);
    const lastAmt = amts[amts.length - 1];
    if (cat === "Tax"){ taxes.push({name: titleCase(k), total: r2(total), monthly: r2(total / months)}); continue; }
    if (cad && BILL_CAT.has(cat)){ bills.push({name: titleCase(k), cat, monthly: r2(perMonth(lastAmt, cad)), cadence: cad}); continue; }
    if (cat === "Subscriptions" || (cad && cat !== "Groceries" && cat !== "Transfers" && cat !== "Transport" && lastAmt < 150)){
      if (cat === "Subscriptions" || cad){
        subs.push({name: titleCase(k), price: r2(lastAmt), cycle: cad === "yearly" ? "yr" : "mo", monthly: r2(perMonth(lastAmt, cad || "monthly")), since: isoOf(list[0].date), lastCharge: isoOf(list[list.length - 1].date), charges: list.length, paid: r2(total), cadence: cad || "monthly"});
        continue;
      }
    }
    spend[cat] = (spend[cat] || 0) + total;
  }
  subs.sort((a, b) => b.monthly - a.monthly); bills.sort((a, b) => b.monthly - a.monthly);
  const spending = Object.entries(spend).map(([cat, total]) => ({cat, name: CAT_LABEL[cat] || cat, monthly: r2(total / months), env: NEEDS_CATS.has(cat) ? "needs" : "misc"})).filter(x => x.monthly >= 1).sort((a, b) => b.monthly - a.monthly);
  const taxMonthly = r2(taxes.reduce((a, t) => a + t.monthly, 0));
  const out = r2(bills.reduce((a, b) => a + b.monthly, 0) + subs.reduce((a, s) => a + s.monthly, 0) + spending.reduce((a, s) => a + s.monthly, 0) + taxMonthly);
  return {fileName, count: tx.length, first: isoOf(first), last: isoOf(last), months, income, monthlyIncome, otherIn: r2(otherIn / months), subs, bills, taxes, taxMonthly, spending, monthlyOut: out};
}

// ---- apply to the plan ----
function applyStatement(R, mode){
  const expenses = [
    ...R.bills.map(b => ({id: uid(), name: b.name, amount: b.monthly, env: "needs", source: "statement"})),
    ...(R.taxMonthly ? [{id: uid(), name: "Tax payments", amount: R.taxMonthly, env: "needs", source: "statement"}] : []),
    ...R.spending.filter(s => s.cat !== "Transfers").map(s => ({id: uid(), name: s.name, amount: s.monthly, env: s.env, source: "statement"}))
  ];
  const subs = R.subs.map(s => ({id: uid(), name: s.name, price: s.price, cycle: s.cycle, last: null, group: "", env: "misc", keep: "auto", since: s.since, charges: s.charges, paid: s.paid, lastCharge: s.lastCharge, source: "statement"}));
  if (mode === "replace"){
    if (R.monthlyIncome) S.income = R.monthlyIncome;
    S.expenses = expenses; S.subs = subs;
    S.swaps = S.swaps.filter(w => linkedItem(w));
  } else {
    if (R.monthlyIncome && !S.income) S.income = R.monthlyIncome;
    const has = (list, n) => list.some(x => x.name.toLowerCase() === n.toLowerCase());
    expenses.forEach(e => { if (!has(S.expenses, e.name)) S.expenses.push(e); });
    subs.forEach(s => { const old = S.subs.find(x => x.name.toLowerCase() === s.name.toLowerCase()); if (old) Object.assign(old, {since: s.since, charges: s.charges, paid: s.paid, lastCharge: s.lastCharge}); else S.subs.push(s); });
  }
  S.payday = R.income[0] ? R.income[0].payday : S.payday;
  S.imported = {file: R.fileName, when: isoDaysAgo(0), from: R.first, to: R.last};
  S.hideNote = true;
  save();
}

async function readStatementFile(file){
  const name = file.name || "statement";
  if (/\.pdf$/i.test(name) || file.type === "application/pdf"){
    const buf = await file.arrayBuffer();
    return analyzeStatement(txFromLines(await pdfLines(buf)), name);
  }
  return analyzeStatement(txFromCSV(await file.text()), name);
}

const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th","st","nd","rd"][n % 10] || "th");

// ---- occasional subscription check-in ----
function reviewPick(){
  const today = isoDaysAgo(0);
  if (S.reviewSnooze === today) return null;
  const cands = S.subs.filter(s => s.keep !== "drop" && (!s.reviewedAt || daysSince(s.reviewedAt) > 30)).sort((a, b) => subMonthly(b) - subMonthly(a)).slice(0, 5);
  if (!cands.length) return null;
  let h = 0; for (const ch of today) h = (h * 31 + ch.charCodeAt(0)) >>> 0; // same pick all day, a different one tomorrow
  return cands[h % cands.length];
}
OUT.reviewCard = () => {
  const s = reviewPick(); if (!s) return "";
  const since = s.since ? `You’ve paid ${fmt(s.paid || 0)} since ${monthsLabel(s.since)}.` : `It costs ${fmt(subMonthly(s))} a month.`;
  return `<section class="card review" data-review-id="${s.id}"><p class="label">Quick check</p>

};
function handleReview(kind, id){
  if (kind === "later"){ S.reviewSnooze = isoDaysAgo(0); save(); refreshOuts(); return; }
  const s = S.subs.find(x => x.id === id); if (!s) return;
  s.reviewedAt = isoDaysAgo(0);
  if (kind === "lot"){ s.last = isoDaysAgo(0); s.low = false; toast(`Keeping ${s.name}.`); }

}

const ASK = {last:""};
function plainly(){
  const C = compute(), now = C.endSaved, best = C.inactiveSwaps[0], b = myBalances();
  const net = b.reduce((a, x) => a + x.net, 0);
  const lines = [];
  lines.push(C.savings >= 0
    ? `In ${C.planMonth} you bring in ${fmt(C.income)} and spend ${fmt(C.needs + C.misc)}, so ${fmt(C.savings)} is yours to keep.`
    : `In ${C.planMonth} you spend ${fmt(C.needs + C.misc - C.income)} more than you bring in. Fix that before anything else.`);
  if (C.savings > 0) lines.push(`Move it to savings on payday. That takes you from ${fmt(S.efSaved)} to ${fmt(now)}.`);
  if (C.needs > C.envNeeds) lines.push(`Bills and food are ${fmt(C.needs - C.envNeeds)} over what you planned for them.`);
  if (C.flagged.length) lines.push(`You pay ${fmt(C.flaggedSave)} a month for ${C.flagged.length} thing${C.flagged.length > 1 ? "s" : ""} you barely use. Dropping them gets you to ${fmt(now + C.flaggedSave)}.`);
  if (best) lines.push(`The biggest easy win: ${best.w.title.toLowerCase()} → ${best.w.alt.toLowerCase()}, about ${fmt(best.save)} a month.`);
  if (Math.abs(net) >= 0.01) lines.push(net > 0 ? `Friends and family owe you ${fmt(net)} overall.` : `You owe friends and family ${fmt(-net)} overall.`);
  return lines.join("\n");
}
function answer(q){
  const C = compute(), t = q.toLowerCase();
  const amt = (t.match(/(\d[\d,]*(?:\.\d+)?)/) || [])[1];
  if (/afford|buy|spend|purchase/.test(t) && amt){
    const a = +amt.replace(/,/g,""), left = C.savings - a;
    return left >= 0 ? `Yes. Spending ${fmt(a)} still leaves ${fmt(left)} saved in ${C.planMonth}.${C.toEF > 0 ? ` Your emergency fund gets ${fmt(Math.min(left, C.efGap))} instead of ${fmt(C.toEF)} this month.` : ""}` : `Not without going short. ${fmt(a)} is ${fmt(-left)} more than ${C.planMonth} leaves. Dropping flagged subscriptions frees ${fmt(C.flaggedSave)} a month.`;
  }
  if (/owe|owed|split|debt/.test(t)){
    const b = myBalances(); if (!b.length) return "Everyone is square. No one owes you and you owe no one.";
    return b.map(x => x.net > 0 ? `${x.p.name} owes you ${fmt(x.net)}` : `You owe ${x.p.name} ${fmt(-x.net)}`).join("\n");
  }
  if (/cancel|drop|unused|subscri/.test(t)){
    return C.flagged.length ? `Your rules flag ${C.flagged.length}:\n${C.flagged.map(s => `${s.name}, ${fmt(subMonthly(s))}/mo (${C.flags[s.id].join("; ")})`).join("\n")}\nTogether: ${fmt(C.flaggedSave)} a month.` : `Nothing is flagged. Every subscription was opened in the last ${S.ruleDays} days.`;
  }
  if (/emergency|fund|cushion/.test(t)){
    if (C.efGap <= 0) return `Your emergency fund is full: ${fmt(S.efSaved)} covers ${S.efMonths} months of needs.`;
    return C.efMonthsLeft ? `You have ${fmt(S.efSaved)} of ${fmt(C.efTarget)}. At ${fmt(C.toEF)} a month it’s full in about ${C.efMonthsLeft} month${C.efMonthsLeft>1?"s":""}.` : `You have ${fmt(S.efSaved)} of ${fmt(C.efTarget)}, but nothing is going to it right now. Set leftover money to emergency fund first on the Plan tab.`;
  }
  if (/cheap|swap|save more|cut/.test(t)){
    const b = C.inactiveSwaps.slice(0,3); return b.length ? `Biggest swaps you’re not using:\n${b.map(x => `${x.w.title} → ${x.w.alt}: keeps ${fmt(x.save)}/mo`).join("\n")}` : "You’re already using every swap on the Cheaper tab.";
  }
  if (/envelope|over|needs|budget/.test(t)){
    const o = C.needs - C.envNeeds, m = C.misc - C.envMisc;
    return `Needs: ${fmt(C.needs)} of ${fmt(C.envNeeds)}${o > 0 ? ` (${fmt(o)} over)` : ""}.\nMisc: ${fmt(C.misc)} of ${fmt(C.envMisc)}${m > 0 ? ` (${fmt(m)} over)` : ""}.\nSavings: ${fmt(C.savings)} against a ${fmt(C.envSave)} envelope.`;
  }
  if (/save|keep|left|end/.test(t)) return `${C.planMonth}: ${fmt(C.income)} in, ${fmt(C.needs + C.misc)} out, ${fmt(C.savings)} kept. Drop what your rules flag and it’s ${fmt(C.savings + C.flaggedSave)}.`;
  return "I can answer from your numbers: what you’ll save, what to cancel, whether you can afford something, who owes you, and when your emergency fund is full.";
}

// ---- Notifications inbox ----
function notifications(){
  if (SH.state !== "ready") return [];
  const me = SH.me, out = [], nm = id => SH.names[id] || "Someone";
  SH.splits.forEach(x => {
    const by = x.updatedBy || x.createdBy, t = x.updatedAt || x.createdAt || 0;
    if (!by || by === me) return;
    if (!(x.paidBy === me || (x.parts && me in x.parts))) return;
    const sh = shares(x), verb = x.deleted ? "deleted" : x.updatedAt ? "edited" : "added you to";
    let detail = "";
    if (!x.deleted){
      if (x.paidBy === me){ const tot = Object.entries(sh).filter(([id]) => id !== me).reduce((a,[,v]) => a + v, 0); detail = `You paid ${fmt(x.amount)}. Others owe you ${fmt(tot)}.`; }
      else if (sh[me]) detail = `You owe ${nm(x.paidBy)} ${fmt(sh[me])}.`;
    } else detail = "It no longer counts toward your balance.";
    out.push({key:`s:${x.id}:${t}`, t, text:`${nm(by)} ${verb} “${x.title}”`, detail});
  });
  SH.pays.forEach(p => {
    const by = p.updatedBy || p.createdBy, t = p.updatedAt || p.createdAt || 0;
    if (!by || by === me || (p.from !== me && p.to !== me)) return;
    const other = p.from === me ? p.to : p.from;
    const text = p.deleted ? `${nm(by)} removed a ${fmt(p.amount)} payment` : p.updatedAt ? `${nm(by)} changed a payment to ${fmt(p.amount)}` : p.to === me ? `${nm(p.from)} marked ${fmt(p.amount)} as paid to you` : `${nm(other)} marked your ${fmt(p.amount)} as paid`;
    out.push({key:`p:${p.id}:${t}`, t, text, detail: p.to === me && !p.deleted ? "Check it arrived. Undo it in History if it didn’t." : ""});
  });
  return out.sort((a,b) => b.t - a.t);
}

async function shWrite(fn, okMsg){

  catch(e){ const code = e && e.code;
    toast(code === "invalid_argument" ? "You can see this circle but not change it. Ask the owner to invite you as an Editor." : code === "quota_exceeded" ? "The shared list is full. Delete old splits first." : "Couldn’t save that. Check your connection and try again.");

async function resolveNames(){
  if (!SH.user) return;
  const ids = new Set(SH.members);
  SH.splits.forEach(x => { [x.createdBy, x.updatedBy, x.paidBy, ...Object.keys(x.parts || {})].forEach(i => i && ids.add(i)); });
  SH.pays.forEach(p => [p.from, p.to, p.createdBy, p.updatedBy].forEach(i => i && ids.add(i)));
  const missing = [...ids].filter(i => !(i in SH.names)); if (!missing.length) return;
  const ps = await SH.user.profiles(missing);
  missing.forEach(i => SH.names[i] = (ps[i] && ps[i].name) || "");

}
function onShared(fromNames){

    SH.known = new Set(notifications().map(n => n.key));

async function initShared(){

    if (!db || !me){ SH.state = "off"; if (S.tab === "split") render(true); return; }

    try { const st = await db.doc(`data/users/${me}/state`).get(); SH.lastSeen = st.exists ? (+st.data().lastSeen || 0) : 0; } catch(e){}
    const fail = e => { if (e && e.code === "revoked"){ SH.state = "off"; renderBell(); if (S.tab === "split") render(true); } };
    db.collection("splits").onSnapshot(q => { SH.splits = q.docs.map(d => ({...d.data(), id:d.id})); SH.loaded.splits = true; onShared(); }, fail);
    db.collection("payments").onSnapshot(q => { SH.pays = q.docs.map(d => ({...d.data(), id:d.id})); SH.loaded.pays = true; onShared(); }, fail);

// ---- photo: shrink to a small square so it fits in the profile record ----
function shrinkPhoto(file){
  return new Promise((ok, bad) => {
    if (!file || !/^image\//.test(file.type)) return bad(new Error("type"));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const n = 192, c = document.createElement("canvas"); c.width = c.height = n; const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", .82)); };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("read")); };
    img.src = url;
  });
}

  if (b.hasAttribute("data-receipt-plus")){ UI.receiptInfo = true; render(true); return; }
  if (b.hasAttribute("data-receipt-close")){ UI.receiptInfo = false; render(true); return; }
  if (b.hasAttribute("data-open-account")){ UI.account = true; UI.inbox = false; if (typeof accInit === "function") accInit(); render(false); return; }
  const sp = b.closest("[data-split]");
  if (sp && b.hasAttribute("data-del-split")){
    if (shared()){ const x = SH.splits.find(y => y.id === sp.dataset.split); if (!x) return;
      await shWrite(() => SH.db.doc("splits/" + x.id).update({deleted:true, updatedBy:SH.me, updatedAt:Date.now()}), `Deleted ${x.title}. Your circle was notified.`); return; }
    const x = S.splits.find(y => y.id === sp.dataset.split);
    S.splits = S.splits.filter(y => y !== x); save(); render(true); toast(`Deleted ${x ? x.title : "split"}.`); return; }
  const st = b.closest("[data-settle]");
  if (st && b.hasAttribute("data-settle-btn")){ const pid = st.dataset.settle, amt = +st.dataset.amt, bal = myBalances().find(x => x.p.id === pid);
    if (!bal) return;
    if (shared()){ const me = SH.me, rec = bal.net > 0 ? {from:pid, to:me} : {from:me, to:pid};
      await shWrite(() => SH.db.collection("payments").doc(uid() + uid()).set({...rec, amount:amt, date:isoDaysAgo(0), createdBy:me, createdAt:Date.now()}), bal.net > 0 ? `Recorded ${fmt(amt)} from ${bal.p.name}. Undo it in History.` : `Recorded ${fmt(amt)} paid to ${bal.p.name}. ${bal.p.name} was notified.`); return; }
    if (bal.net > 0) S.settlements.push({id:uid(), from:pid, to:"me", amount:amt, date:isoDaysAgo(0)});
    else S.settlements.push({id:uid(), from:"me", to:pid, amount:amt, date:isoDaysAgo(0)});
    save(); render(true); toast(bal.net > 0 ? `Recorded ${fmt(amt)} from ${bal.p.name}. Undo it in History.` : `Recorded ${fmt(amt)} paid to ${bal.p.name}. Undo it in History.`); return; }
  const pay = b.closest("[data-pay]");
  if (pay && shared()){ const x = SH.pays.find(y => y.id === pay.dataset.pay); if (!x) return;
    if (b.hasAttribute("data-pay-edit")){ UI.editPay = x.id; render(true); return; }
    if (b.hasAttribute("data-pay-cancel")){ UI.editPay = null; render(true); return; }
    if (b.hasAttribute("data-pay-del")){ UI.editPay = null; if (await shWrite(() => SH.db.doc("payments/" + x.id).update({deleted:true, updatedBy:SH.me, updatedAt:Date.now()}))) toast(backInList(x)); render(true); return; }
    if (b.hasAttribute("data-pay-save")){ const a = numv(pay.querySelector("[data-pay-amt]").value), dt = pay.querySelector("[data-pay-date]").value;
      if (a <= 0){ toast("Enter an amount above zero, or delete the payment."); return; }
      UI.editPay = null; await shWrite(() => SH.db.doc("payments/" + x.id).update({amount:a, date: dt || x.date, updatedBy:SH.me, updatedAt:Date.now()}), "Payment updated."); render(true); return; }
    return;
  }
  if (pay){ const x = S.settlements.find(y => y.id === pay.dataset.pay); if (!x) return;
    if (b.hasAttribute("data-pay-edit")){ UI.editPay = x.id; render(true); return; }
    if (b.hasAttribute("data-pay-cancel")){ UI.editPay = null; render(true); return; }
    if (b.hasAttribute("data-pay-del")){ S.settlements = S.settlements.filter(y => y !== x); UI.editPay = null; save(); render(true); toast(backInList(x)); return; }
    if (b.hasAttribute("data-pay-save")){ const a = numv(pay.querySelector("[data-pay-amt]").value), dt = pay.querySelector("[data-pay-date]").value;
      if (a <= 0){ toast("Enter an amount above zero, or delete the payment."); return; }
      x.amount = a; if (dt) x.date = dt; UI.editPay = null; save(); render(true); toast("Payment updated."); return; }
  }
  if (sp && b.hasAttribute("data-edit-split")){ const x = CTX().splits.find(y => y.id === sp.dataset.split); if (!x) return;
    const parts = {}; for (const id in x.parts) parts[id] = x.method === "equal" ? 1 : String(x.parts[id]);
    splitDraft = {editId:x.id, title:x.title, amount:String(x.amount), paidBy:x.paidBy, tag:x.tag, method:x.method, parts: x.method === "borrow" ? {} : parts, borrower: x.method === "borrow" ? Object.keys(x.parts)[0] : ""};
    splitErr = ""; render(false); return; }
  if (b.hasAttribute("data-add-person-open")){ UI.addPerson = true; render(true); const i = $("new-person"); if (i) i.focus(); return; }
  if (b.hasAttribute("data-add-person-cancel")){ UI.addPerson = false; render(true); return; }
  if (b.hasAttribute("data-person-open")){ const id = b.closest("[data-person]").dataset.person; UI.editPerson = UI.editPerson === id ? null : id; render(true); return; }
  if (b.hasAttribute("data-person-done")){ UI.editPerson = null; render(true); return; }
  const pr = b.closest("[data-person]");
  if (pr && b.hasAttribute("data-del-person")){ const id = pr.dataset.person;
    const p = S.people.find(x => x.id === id); if (!p) return;
    const bal = myBalances({kind:"local", me:"me", splits:S.splits, pays:S.settlements, people:S.people}).find(x => x.p.id === id);
    if (bal){ toast(bal.net > 0 ? `${p.name} still owes you ${fmt(bal.net)}. Settle up first.` : `You still owe ${p.name} ${fmt(-bal.net)}. Settle up first.`); return; }
    const inHistory = S.splits.some(x => x.paidBy === id || (x.parts && id in x.parts)) || S.settlements.some(x => x.from === id || x.to === id);
    if (inHistory) p.archived = true; else S.people = S.people.filter(x => x.id !== id);  // settled people leave the list; past splits keep their name
    save(); render(true); toast(inHistory ? `Removed ${p.name}. Past splits still show their name.` : `Removed ${p.name}.`); return; }
  if (b.hasAttribute("data-import")){
    if (navigator.contacts && navigator.contacts.select){
      try { const got = await navigator.contacts.select(["name"], {multiple:true}); addNames(got.map(c => (c.name||[])[0]).filter(Boolean)); return; } catch(err){ /* fall back to file */ }
    }
    $("vcf").click(); return;
  }
});

view.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, fd = new FormData(f);
  if (kind === "ask"){ const q = $("ask-in").value.trim(); if (!q) return; ASK.last = answer(q); const o = $("ask-out"); o.hidden = false; o.textContent = ASK.last; $("ask-in").blur(); return; }
  if (kind === "addSub"){ const name = String(fd.get("name")).trim(), price = numv(fd.get("price")); if (!name || !price){ toast("Add a name and a price."); return; }
    S.subs.push({id:uid(), name, price, cycle:fd.get("cycle"), last:fd.get("last") || isoDaysAgo(0), group:String(fd.get("group")||"").trim(), env:"misc", keep:"auto"}); save(); render(true); toast(`Added ${name}.`); return; }
  if (kind === "addSwap"){ const link = fd.get("link"), alt = String(fd.get("alt")).trim(); if (!link || !alt){ toast("Pick what you pay for and name the cheaper option."); return; }
    const [type,id] = link.split(":"), src = type === "expense" ? S.expenses.find(x=>x.id===id) : S.subs.find(x=>x.id===id);
    S.swaps.push({id:uid(), link, title: src ? src.name : "", alt, altCost:numv(fd.get("altCost")), note:"", on:false}); save(); render(true); toast("Comparison added."); return; }
  if (kind === "addCode"){ const store = String(fd.get("store")).trim(), code = String(fd.get("code")).trim(); if (!store || !code) return;
    S.codes.unshift({id:uid(), store, code, offer:String(fd.get("offer")||"").trim(), worked:0, failed:0, last:isoDaysAgo(0), mine:true}); save(); render(true); toast(`Saved the ${store} code.`); return; }
  if (kind === "addPerson"){ const name = String(fd.get("name")).trim(); if (!name){ toast("Type a name first."); return; } UI.addPerson = false; addNames([name]); return; }
  if (kind === "split"){
    const d = splitDraft, amount = numv(d.amount);
    if (!d.title.trim()){ splitErr = "Say what the split is for."; render(true); return; }
    if (amount <= 0){ splitErr = "Enter a total above zero."; render(true); return; }
    let parts = {};
    if (d.method === "borrow"){ const who = d.borrower || (CTX().people.find(p => p.id !== d.paidBy) || {}).id; if (!who){ splitErr = "Add another person first."; render(true); return; } parts[who] = amount; }
    else {
      const ids = Object.keys(d.parts); if (ids.length < 2){ splitErr = "Pick at least two people."; render(true); return; }
      if (d.method === "equal") ids.forEach(id => parts[id] = 1);
      else { ids.forEach(id => parts[id] = numv(d.parts[id]));
        const sum = ids.reduce((a,id) => a + parts[id], 0);
        if (d.method === "percent" && Math.abs(sum - 100) > 0.01){ splitErr = `Percentages add up to ${r2(sum)}%. Make them total 100%.`; render(true); return; }
        if (d.method === "exact" && Math.abs(sum - amount) > 0.01){ splitErr = `Amounts add up to ${fmt(sum)}, not ${fmt(amount)}.`; render(true); return; } }
    }
    const rec = {title:d.title.trim(), amount, tag:d.tag, paidBy:d.paidBy, method:d.method, parts};
    if (shared()){
      const me = SH.me, old = d.editId && SH.splits.find(y => y.id === d.editId);
      const ok = old ? await shWrite(() => { const {id, ...body} = old; return SH.db.doc("splits/" + old.id).set({...body, ...rec, updatedBy:me, updatedAt:Date.now()}); }, "Split updated. Your circle was notified.")
                     : await shWrite(() => SH.db.collection("splits").doc(uid() + uid()).set({...rec, date:isoDaysAgo(0), createdBy:me, createdAt:Date.now()}), "Split saved. Everyone in it was notified.");
      if (ok){ splitDraft = null; splitErr = ""; render(false); }
      return;
    }
    const old = d.editId && S.splits.find(y => y.id === d.editId);
    if (old) Object.assign(old, rec); else S.splits.push({id:uid(), ...rec, date:isoDaysAgo(0)});
    splitDraft = null; splitErr = ""; save(); render(false); toast(old ? "Split updated." : "Split saved."); return;
  }
});

function addNames(names){
  let added = 0;
  names.map(n => String(n).trim()).filter(Boolean).forEach(n => { const old = S.people.find(p => p.name.toLowerCase() === n.toLowerCase());
    if (!old){ S.people.push({id:uid(), name:n}); added++; } else if (old.archived){ old.archived = false; added++; } });
  save(); render(true); toast(added ? `Added ${added} ${added === 1 ? "person" : "people"}.` : "Everyone there is already on your list.");
}
$("stmt").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  toast("Reading your statement…");
  try { STMT.result = await readStatementFile(file); UI.inbox = false; $("toast").hidden = true; render(false); }
  catch(err){ toast(err && err.message ? err.message : "Couldn't read that file."); }
});
$("vcf").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { const names = String(rd.result).split(/\r?\n/).filter(l => /^FN[:;]/i.test(l)).map(l => l.replace(/^FN[^:]*:/i, "").replace(/\\,/g, ",").trim()); if (!names.length) toast("No names found in that file."); else addNames(names); e.target.value = ""; };
  rd.readAsText(file);
});

save();
applyTheme();
render(false);
initShared();
})();
</script>
